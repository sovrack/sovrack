# =============================================================================
# Frontend CI — lint · typecheck · contract drift · build.
# This repo's root IS the frontend (no monorepo cd).
# =============================================================================
stages:
  - validate
  - build
  - security

default:
  image: node:20

variables:
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_WS_URL: http://localhost:3001

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck:
  stage: validate
  script:
    - npm ci
    - npx tsc --noEmit

lint:
  stage: validate
  script:
    - npm ci
    - npm run lint

test:
  stage: validate
  script:
    - npm ci
    # test:cov enforces the coverage thresholds (scoped to src/lib) in vitest.config.
    - npm run test:cov
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

contract:check:
  stage: validate
  script:
    - npm ci
    # Re-generate TypeScript types from the committed openapi.json, then fail
    # if api-contract.ts drifts — meaning someone updated the JSON but forgot
    # to re-run 'npm run contract:types' and commit the result.
    # Note: updating api-contract.openapi.json itself requires running
    # 'npm run contract:generate' locally (needs backend running) and committing both files.
    - npm run contract:types
    - 'git diff --exit-code src/generated/api-contract.ts || (echo "ERROR: api-contract.ts is outdated. Run ''npm run contract:types'' and commit the result." && exit 1)'

build:
  stage: build
  script:
    - npm ci
    - npm run build

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory.
security:audit:
  stage: security
  script:
    - npm ci
    - npm audit --audit-level=high

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by the
# test job (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  needs:
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# Trivy filesystem scan (dependencies). Informational (CVE feeds change daily).
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true
