# =============================================================================
# Frontend CI — lint · typecheck · contract drift · build.
# This repo's root IS the frontend (no monorepo cd).
# =============================================================================
stages:
  - validate
  - build
  - security

default:
  image: node:22
  # Utilise le runner privé du VPS (tags: vps) au lieu des runners SaaS partagés
  # (qui consomment le quota payant et ont causé des échecs "ci_quota_exceeded").
  tags:
    - vps

variables:
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_WS_URL: ws://localhost:3001

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck:
  stage: validate
  script:
    - npm ci
    - npm run type-check

lint:
  stage: validate
  script:
    - npm ci
    - npm run check:architecture
    - npm run lint

test:
  stage: validate
  script:
    - npm ci
    # test:cov enforces the coverage thresholds (scoped to src/lib) in vitest.config.
    - npm run test:cov
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

contract:check:
  stage: validate
  script:
    - npm ci
    # Re-generate TypeScript types from the committed openapi.json, then fail
    # if api-contract.ts drifts — meaning someone updated the JSON but forgot
    # to re-run 'npm run contract:types' and commit the result.
    # Note: updating api-contract.openapi.json itself requires running
    # 'npm run contract:generate' locally (needs backend running) and committing both files.
    - npm run contract:types
    - 'git diff --exit-code src/generated/api-contract.ts || (echo "ERROR: api-contract.ts is outdated. Run ''npm run contract:types'' and commit the result." && exit 1)'

build:
  stage: build
  script:
    - npm ci
    - npm run build

# Construit et pousse l'image Docker de production (méthode B, plan produit
# final). Kaniko : ce runner n'a pas Docker-in-Docker (limite déjà rencontrée
# et contournée pour test:e2e backend/Testcontainers).
# L'app utilise NEXT_PUBLIC_API_URL=/api (chemin relatif) + le rewrite serveur
# /backend-api → BACKEND_INTERNAL_URL (URL interne du backend, réseau Docker).
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-/backend-api}"
      --build-arg "NEXT_PUBLIC_WS_URL=${PUBLIC_WS_URL:-/backend-api}"
      --build-arg "NEXT_PUBLIC_APP_NAME=Sovrack"
      --build-arg "NEXT_PUBLIC_APP_VERSION=2.0.0"
      --build-arg "BACKEND_INTERNAL_URL=http://backend:3001"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─────────────────────────────────────────────────────────────────────────────
# DÉPLOIEMENT PRODUCTION — *géré par le dépôt `deploy-automation-infra`*
# -----------------------------------------------------------------------------
# Ce dépôt "app" ne fait QUE construire et pousser son image au Container
# Registry GitLab (job `build:image` → tag immuable `:$CI_COMMIT_SHA`).
#
# La mise à jour du service en production est orchestrée par le dépôt dédié
# `deploy-automation-infra` (stack `sovrack`). → NE PAS réintroduire de
# SSH/deploy ici (l'ancien chemin `/data/instances/app` n'existe pas).
# ─────────────────────────────────────────────────────────────────────────────

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory.
security:audit:
  stage: security
  script:
    - npm ci
    # Inclut les outils de build/test : ils manipulent eux aussi du code et des
    # artefacts dans le runner CI.
    - npm audit --audit-level=high

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by the
# test job (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  needs:
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# Trivy filesystem scan (dependencies). Informational (CVE feeds change daily).
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true

# Scan the exact immutable runtime image as well as the source tree. This catches
# vulnerabilities in the base image and globally installed tools.
security:image:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  needs:
    - build:image
  variables:
    TRIVY_USERNAME: '$CI_REGISTRY_USER'
    TRIVY_PASSWORD: '$CI_REGISTRY_PASSWORD'
  script:
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
