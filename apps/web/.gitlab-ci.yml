# =============================================================================
# Frontend CI — lint · typecheck · contract drift · build.
# This repo's root IS the frontend (no monorepo cd).
# =============================================================================
stages:
  - validate
  - build
  - security

default:
  image: node:22
  # Utilise le runner privé du VPS (tags: vps) au lieu des runners SaaS partagés
  # (qui consomment le quota payant et ont causé des échecs "ci_quota_exceeded").
  tags:
    - vps

variables:
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_WS_URL: ws://localhost:3001

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck:
  stage: validate
  script:
    - npm ci
    - npx tsc --noEmit

lint:
  stage: validate
  script:
    - npm ci
    - npm run lint

test:
  stage: validate
  script:
    - npm ci
    # test:cov enforces the coverage thresholds (scoped to src/lib) in vitest.config.
    - npm run test:cov
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

contract:check:
  stage: validate
  script:
    - npm ci
    # Re-generate TypeScript types from the committed openapi.json, then fail
    # if api-contract.ts drifts — meaning someone updated the JSON but forgot
    # to re-run 'npm run contract:types' and commit the result.
    # Note: updating api-contract.openapi.json itself requires running
    # 'npm run contract:generate' locally (needs backend running) and committing both files.
    - npm run contract:types
    - 'git diff --exit-code src/generated/api-contract.ts || (echo "ERROR: api-contract.ts is outdated. Run ''npm run contract:types'' and commit the result." && exit 1)'

build:
  stage: build
  script:
    - npm ci
    - npm run build

# Construit et pousse l'image Docker de production (méthode B, plan produit
# final). Kaniko : ce runner n'a pas Docker-in-Docker (limite déjà rencontrée
# et contournée pour test:e2e backend/Testcontainers).
# L'app utilise NEXT_PUBLIC_API_URL=/api (chemin relatif) + le rewrite serveur
# /backend-api → BACKEND_INTERNAL_URL (URL interne du backend, réseau Docker).
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-/api}"
      --build-arg "NEXT_PUBLIC_WS_URL=${PUBLIC_API_URL:-/api}"
      --build-arg "NEXT_PUBLIC_APP_NAME=Sovrack"
      --build-arg "NEXT_PUBLIC_APP_VERSION=2.0.0"
      --build-arg "BACKEND_INTERNAL_URL=http://backend:3001"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Auto-deploy to production (main branch only, triggered on merge/push).
# CI/CD variables: PRODUCTION_HOST, PRODUCTION_SSH_USER, SSH_PRIVATE_KEY,
# REGISTRY_USER, REGISTRY_PASSWORD.
# Requirements in CI/CD variables:
#   - PRODUCTION_HOST: hostname/IP of the VPS (ex. 137.74.168.240)
#   - PRODUCTION_SSH_USER: ssh user (ex. ubuntu)
#   - SSH_PRIVATE_KEY: private key authorized on the VPS for PRODUCTION_SSH_USER
#   - REGISTRY_USER / REGISTRY_PASSWORD: GitLab deploy token with read_registry
# The stack lives in /data/instances/app (compose project "da-app") and pulls
# the frontend image pushed by build:image from the GitLab Container Registry.
deploy:production:
  stage: build
  image: alpine:3
  needs:
    - job: build:image
      artifacts: false
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Écrit la clé dans un fichier (fix du `ssh-add` qui échoue avec
    # "error in libcrypto: unsupported" sur OpenSSL 3.5.7). Échec explicite si
    # la variable CI SSH_PRIVATE_KEY est absente/vide.
    - '[ -n "$SSH_PRIVATE_KEY" ] || { echo "ERROR: SSH_PRIVATE_KEY is empty/unset"; exit 1; }'
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null  # valide le format de la clé
    - ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh -i ~/.ssh/id_deploy "${PRODUCTION_SSH_USER:-ubuntu}@$PRODUCTION_HOST" "
        cd /data/instances/app &&
        printf '%s' '$REGISTRY_PASSWORD' | sudo docker login ${CI_REGISTRY:-registry.gitlab.com} -u $REGISTRY_USER --password-stdin &&
        sudo docker compose pull &&
        sudo docker compose up -d &&
        sudo docker exec da-nginx nginx -s reload 2>/dev/null || true
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory.
security:audit:
  stage: security
  script:
    - npm ci
    - npm audit --audit-level=high --omit=dev

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by the
# test job (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  needs:
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# Trivy filesystem scan (dependencies). Informational (CVE feeds change daily).
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true
