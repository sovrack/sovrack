<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Background Container -->
  <rect width="120" height="120" rx="28" fill="#090D16"/>
  
  <!-- Subtle Glow Filter -->
  <defs>
    <linearGradient id="shieldGrad" x1="24" y1="20" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="40" y1="30" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Sovereign Shield Contour -->
  <path d="M60 18 L94 30 V58 C94 80 60 98 60 98 C60 98 26 80 26 58 V30 Z" 
        fill="url(#shieldGrad)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>

  <!-- Top Rack Shelf (forms top of 'S') -->
  <rect x="38" y="36" width="44" height="10" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <circle cx="44" cy="41" r="2" fill="#10B981"/>
  <circle cx="50" cy="41" r="2" fill="#64748B"/>
  <rect x="68" y="39" width="10" height="4" rx="1" fill="#10B981" opacity="0.8"/>

  <!-- Middle Rack Shelf with Sovereign Node (forms spine of 'S') -->
  <rect x="38" y="52" width="44" height="10" rx="3" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="44" cy="57" r="2" fill="#F59E0B"/>
  <circle cx="50" cy="57" r="2" fill="#10B981"/>
  <path d="M62 55 L74 57 L62 59 Z" fill="#10B981"/>

  <!-- Bottom Rack Shelf (forms base of 'S') -->
  <rect x="38" y="68" width="44" height="10" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <circle cx="44" cy="73" r="2" fill="#10B981"/>
  <circle cx="50" cy="73" r="2" fill="#64748B"/>
  <rect x="60" y="71" width="18" height="4" rx="1" fill="#334155"/>
</svg>
