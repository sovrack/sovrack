# =============================================================================
# Stack FRONTEND (dev / standalone) : Next.js.
# NEXT_PUBLIC_API_URL est injectée au BUILD (variable publique Next.js) → elle
# doit pointer vers l'URL publique du backend. `docker compose up -d --build`.
# =============================================================================
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-platform}
    container_name: platform_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
