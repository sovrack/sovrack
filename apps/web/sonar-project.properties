# SonarQube configuration — Sovrack Web (Next.js).
# Run via the `sonarqube` CI job (needs SONAR_HOST_URL + SONAR_TOKEN).
sonar.projectKey=sovrack-web
sonar.projectName=Sovrack Web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8

# Coverage (vitest run --coverage emits coverage/lcov.info, scoped to src/lib).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude generated / vendored / non-product code from analysis + coverage.
sonar.exclusions=node_modules/**,.next/**,coverage/**,src/generated/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/generated/**,src/app/**/layout.tsx,src/app/**/loading.tsx

# Block the pipeline on the project's Quality Gate result.
sonar.qualitygate.wait=true
