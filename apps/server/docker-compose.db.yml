# =============================================================================
# DOCKER COMPOSE - BACKEND DEVOPS PLATFORM (DB ONLY FOR LOCAL APP MODE)
# =============================================================================
# Ce fichier lance la base PostgreSQL pour travailler en local avec:
# - backend lance en local (npm run start:dev)
# - frontend lance en local (npm run dev)
#
# Commandes principales (depuis la racine du projet):
# - Lancer DB: docker-compose -f devops/docker/docker-compose.db.yml up -d
# - Arreter DB (sans supprimer): docker-compose -f devops/docker/docker-compose.db.yml stop
# - Arreter et supprimer (conteneur + reseau): docker-compose -f devops/docker/docker-compose.db.yml down
# - Nettoyer aussi les donnees PostgreSQL: docker-compose -f devops/docker/docker-compose.db.yml down -v
# - Voir l'etat: docker-compose -f devops/docker/docker-compose.db.yml ps
#
# Variables d'environnement lues depuis backend/.env (DB_USER, DB_PASSWORD, DB_NAME, DB_PORT)
# Le backend et le frontend lisent toujours DATABASE_URL=postgresql://...@localhost:5432/...
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SERVICE DATABASE (PostgreSQL)
  # ---------------------------------------------------------------------------
  # Role:
  # - Fournit la base de donnees PostgreSQL pour Prisma/NestJS.
  # - Expose le port DB_PORT vers l'hote pour DBeaver ou autres clients.
  database:
    image: postgres:16-alpine
    container_name: nestjs_devops_db
    restart: unless-stopped

    # Variables d'initialisation de PostgreSQL.
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-devops_platform}

    # Healthcheck: permet a Compose de savoir quand la DB est vraiment prete.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devops_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    # Port host:container => ex: 5432:5432
    ports:
      - "${DB_PORT:-5432}:5432"

    # Volume persistant pour conserver les donnees meme apres arret du conteneur.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # SERVICE REDIS
  # ---------------------------------------------------------------------------
  # Role:
  # - File de jobs BullMQ (worker de deploiement) + stockage du rate-limiter
  #   (ThrottlerStorageRedisService). REQUIS par le backend au demarrage
  #   (sinon: "REDIS_URL is required for BullMQ queue").
  # - Le backend lit REDIS_URL=redis://localhost:6379 depuis backend/.env
  redis:
    image: redis:7-alpine
    container_name: nestjs_devops_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # SERVICE BACKEND (NestJS)
  # ---------------------------------------------------------------------------
  # Demande utilisateur: garder la partie backend en commentaire (ne pas retirer).
  # backend:
  #   image: node:22-alpine
  #   container_name: nestjs_devops_api
  #   restart: unless-stopped
  #   working_dir: /app
  #   depends_on:
  #     database:
  #       condition: service_healthy
  #   env_file:
  #     - ../../backend/.env
  #   environment:
  #     DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
  #   command: sh -c "npm install && npm run prisma:generate && npm run start:dev"
  #   ports:
  #     - "${PORT:-3001}:3001"
  #   volumes:
  #     - ../../backend:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  redis_data:
