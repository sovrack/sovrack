---
# Internal DevOps Platform - Detect Server Info
# Read-only, idempotent. No installations. Safe on any VPS.
# Ansible runs on the control node. Target VPS is an agentless SSH host.

- name: "Internal Platform | Detect server info"
  hosts: "{{ target_hosts | default('targets') }}"
  become: true
  gather_facts: true

  tasks:
    - name: "Detect | OS and system facts"
      ansible.builtin.debug:
        msg:
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          os_id: "{{ ansible_distribution | lower }}"
          architecture: "{{ ansible_architecture }}"
          python_version: "{{ ansible_python_version | default('unknown') }}"
          hostname: "{{ ansible_hostname }}"
          fqdn: "{{ ansible_fqdn }}"
          kernel: "{{ ansible_kernel }}"
          total_memory_mb: "{{ ansible_memtotal_mb | default(0) }}"
          processor_count: "{{ ansible_processor_vcpus | default(1) }}"

    # ── Docker Engine ──────────────────────────────────────────────────────────
    - name: "Detect | Docker version"
      ansible.builtin.command: docker --version
      register: detect_docker
      changed_when: false
      failed_when: false

    - name: "Detect | Docker Compose plugin version"
      ansible.builtin.command: docker compose version
      register: detect_docker_compose
      changed_when: false
      failed_when: false

    # ── Web / Runtime ──────────────────────────────────────────────────────────
    - name: "Detect | Nginx version"
      ansible.builtin.command: nginx -v
      register: detect_nginx
      changed_when: false
      failed_when: false

    - name: "Detect | Node.js version"
      ansible.builtin.command: node --version
      register: detect_nodejs
      changed_when: false
      failed_when: false

    # ── Databases ─────────────────────────────────────────────────────────────
    - name: "Detect | PostgreSQL version"
      ansible.builtin.command: psql --version
      register: detect_postgres
      changed_when: false
      failed_when: false

    - name: "Detect | Redis version"
      ansible.builtin.command: redis-server --version
      register: detect_redis
      changed_when: false
      failed_when: false

    # ── CI/CD ─────────────────────────────────────────────────────────────────
    - name: "Detect | GitLab Runner version"
      ansible.builtin.command: gitlab-runner --version
      register: detect_gitlab_runner
      changed_when: false
      failed_when: false

    # ── Security ──────────────────────────────────────────────────────────────
    - name: "Detect | UFW Firewall"
      ansible.builtin.command: ufw --version
      register: detect_ufw
      changed_when: false
      failed_when: false

    - name: "Detect | Fail2ban"
      ansible.builtin.command: fail2ban-server --version
      register: detect_fail2ban
      changed_when: false
      failed_when: false

    - name: "Detect | Certbot"
      ansible.builtin.command: certbot --version
      register: detect_certbot
      changed_when: false
      failed_when: false

    # ── System ────────────────────────────────────────────────────────────────
    - name: "Detect | Systemd available"
      ansible.builtin.command: command -v systemctl
      register: detect_systemd
      changed_when: false
      failed_when: false

    - name: "Detect | Python3 available"
      ansible.builtin.command: command -v python3
      register: detect_python3
      changed_when: false
      failed_when: false

    - name: "Detect | Swap usage"
      ansible.builtin.command: swapon --show
      register: detect_swap
      changed_when: false
      failed_when: false

    # ── Summary ───────────────────────────────────────────────────────────────
    - name: "Detect | Detection summary"
      ansible.builtin.debug:
        msg:
          docker: "{{ 'installed' if detect_docker.rc == 0 else 'missing' }} — {{ (detect_docker.stdout | default(detect_docker.stderr, true) | trim).split('\n')[0] if detect_docker.rc == 0 else 'not found' }}"
          docker_compose: "{{ 'installed' if detect_docker_compose.rc == 0 else 'missing' }}"
          nginx: "{{ 'installed' if detect_nginx.rc == 0 else 'missing' }}"
          nodejs: "{{ 'installed' if detect_nodejs.rc == 0 else 'missing' }} — {{ detect_nodejs.stdout | trim if detect_nodejs.rc == 0 else 'not found' }}"
          postgres: "{{ 'installed' if detect_postgres.rc == 0 else 'missing' }}"
          redis: "{{ 'installed' if detect_redis.rc == 0 else 'missing' }}"
          gitlab_runner: "{{ 'installed' if detect_gitlab_runner.rc == 0 else 'missing' }}"
          ufw: "{{ 'installed' if detect_ufw.rc == 0 else 'missing' }}"
          fail2ban: "{{ 'installed' if detect_fail2ban.rc == 0 else 'missing' }}"
          certbot: "{{ 'installed' if detect_certbot.rc == 0 else 'missing' }}"
          systemd: "{{ 'available' if detect_systemd.rc == 0 else 'missing' }}"
          python3: "{{ 'available' if detect_python3.rc == 0 else 'missing' }}"
          swap_active: "{{ 'yes' if detect_swap.stdout | trim | length > 0 else 'no' }}"
