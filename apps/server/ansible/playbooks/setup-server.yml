---
# Deploy Automation - Setup Server
# Ansible runs only on the control node. Target VPS hosts are agentless SSH targets.

- name: "Internal Platform | Setup remote VPS from control node"
  hosts: "{{ target_hosts | default('targets') }}"
  become: true
  gather_facts: true

  vars:
    managed_by: "{{ managed_by | default('deployautomation-control-node') }}"

  pre_tasks:
    - name: "Setup | Set default roles when not provided via extra-vars"
      ansible.builtin.set_fact:
        selected_roles:
          - system_base
          - docker
      when: selected_roles is not defined or (selected_roles | length == 0)
      tags: always

    - name: "Setup | Assert selected roles are valid"
      ansible.builtin.assert:
        that:
          - selected_roles is iterable
          - selected_roles | length > 0
          - selected_roles | difference(allowed_setup_roles) | length == 0
        fail_msg: "Invalid selected_roles. Allowed roles: {{ allowed_setup_roles | join(', ') }}"
      vars:
        allowed_setup_roles:
          - system_base
          - docker
          - docker_tls
          - traefik
          - nixpacks
          - gitlab_runner
          - firewall
          - fail2ban
          - system_diagnostics
          - node_exporter
          - cadvisor
          - prometheus
          - grafana
          - alertmanager
          - loki
          - logrotate
          - swap
          - security_hardening
      tags: always

    - name: "Setup | Explain execution model"
      ansible.builtin.debug:
        msg:
          - "Ansible is executed from the control node, not installed on the VPS."
          - "Target: {{ inventory_hostname }}"
          - "Roles: {{ selected_roles | join(', ') }}"
          - "Managed by: {{ managed_by }}"
      tags: always

  tasks:
    - name: "Setup | Run selected role"
      ansible.builtin.include_role:
        name: "{{ setup_role }}"
      loop: "{{ selected_roles }}"
      loop_control:
        loop_var: setup_role
      tags: always

  post_tasks:
    - name: "Setup | Completion summary"
      ansible.builtin.debug:
        msg: "Server preparation completed with roles: {{ selected_roles | join(', ') }}"
      tags: always
