---
# =============================================================================
# SSL certificate issuance — Let's Encrypt (Certbot) + Nginx reverse proxy.
# =============================================================================
# Invoque par le backend (SslCertificateService.issueAndConfigure) pour obtenir
# et installer un certificat TLS pour un domaine pointant vers une app deployee.
#
# Le playbook :
#   1. installe nginx + certbot (role ssl),
#   2. cree un vhost nginx domain_name -> 127.0.0.1:app_port,
#   3. lance certbot --nginx pour emettre + installer le certificat.
#
# Extra-vars requis (passes par le backend) :
#   domain_name    FQDN du domaine (ex: app.example.com)
#   certbot_email  Email Let's Encrypt (enregistrement + alertes expiration)
#   app_port       Port local de l'app (nginx proxy domain -> ce port)
#   server_host    Hote VPS cible (informatif ; ciblage via l'inventaire 'targets')
# =============================================================================

- name: "SSL | Emettre le certificat Let's Encrypt pour {{ domain_name }}"
  hosts: "{{ target_hosts | default('targets') }}"
  become: true
  gather_facts: true

  vars:
    # Mapping vers les variables attendues par le role ssl.
    ssl_email: "{{ certbot_email }}"
    ssl_install_nginx_plugin: true
    ssl_domains:
      - "{{ domain_name }}"

  pre_tasks:
    - name: "SSL | Valider les variables requises"
      ansible.builtin.assert:
        that:
          - domain_name | default('') | length > 0
          - certbot_email | default('') | length > 0
          - app_port | default('') | string | length > 0
        fail_msg: "domain_name, certbot_email et app_port sont requis."
      tags: always

    - name: "SSL | S'assurer que nginx est installe"
      ansible.builtin.package:
        name: nginx
        state: present

    - name: "SSL | Creer le vhost nginx (reverse proxy {{ domain_name }} -> :{{ app_port }})"
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name {{ domain_name }};

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
      notify: reload nginx

    - name: "SSL | Activer le vhost"
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ domain_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ domain_name }}.conf"
        state: link
      notify: reload nginx

    - name: "SSL | Recharger nginx maintenant (pour que certbot voie le vhost)"
      ansible.builtin.service:
        name: nginx
        state: reloaded

  roles:
    # Le role ssl installe certbot et lance:
    #   certbot --nginx --non-interactive --agree-tos --email {{ ssl_email }} -d {{ domain }}
    - ssl

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
