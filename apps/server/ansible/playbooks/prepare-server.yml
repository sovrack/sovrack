---
# Internal DevOps Platform - Prepare Server
# Ansible runs only on the control node. Target VPS hosts are agentless SSH targets.

- name: "Internal Platform | Prepare remote VPS from control node"
  hosts: "{{ target_hosts | default('targets') }}"
  become: true
  gather_facts: true

  vars:
    preparation_options: "{{ preparation_options | default({}) }}"
    managed_by: "{{ managed_by | default('internal-devops-platform-control-node') }}"

  pre_tasks:
    - name: "Prepare | Set default roles when not provided via extra-vars"
      ansible.builtin.set_fact:
        selected_roles:
          - system_base
          - docker
      when: selected_roles is not defined or (selected_roles | length == 0)
      tags: always

    - name: "Prepare | Assert selected roles are valid"
      ansible.builtin.assert:
        that:
          - selected_roles is iterable
          - selected_roles | length > 0
          - selected_roles | difference(allowed_prepare_roles) | length == 0
        fail_msg: "Invalid selected_roles. Allowed roles: {{ allowed_prepare_roles | join(', ') }}"
      vars:
        allowed_prepare_roles:
          - system_base
          - docker
          - docker_tls
          - nginx
          - nixpacks
          - nodejs
          - postgres
          - redis
          - gitlab_runner
          - firewall
          - fail2ban
          - ssl
          - monitoring
          - node_exporter
          - cadvisor
          - prometheus
          - grafana
          - alertmanager
          - loki
          - backup
          - logrotate
          - swap
          - security_hardening
      tags: always

    - name: "Prepare | Explain execution model"
      ansible.builtin.debug:
        msg:
          - "Ansible is executed from the control node, not installed on the VPS."
          - "Target: {{ inventory_hostname }}"
          - "Roles: {{ selected_roles | join(', ') }}"
          - "Managed by: {{ managed_by }}"
      tags: always

  tasks:
    - name: "Prepare | Run selected role"
      ansible.builtin.include_role:
        name: "{{ prepare_role }}"
      loop: "{{ selected_roles }}"
      loop_control:
        loop_var: prepare_role
      tags: always

  post_tasks:
    - name: "Prepare | Completion summary"
      ansible.builtin.debug:
        msg: "Server preparation completed with roles: {{ selected_roles | join(', ') }}"
      tags: always
