---
- name: Deploiement applicatif via Docker (Production-Ready)
  hosts: targets
  become: true
  vars:
    container_name: "{{ container_name | default('deploy-app') }}"
    app_port: "{{ app_port | default(3000) }}"
    docker_image: "{{ docker_image }}"
    # Immutable SHA digest (sha256:...). When provided, used instead of
    # the mutable tag for pull and container run — guarantees the exact
    # same image layer on every deploy and rollback.
    docker_image_sha: "{{ docker_image_sha | default('') }}"
    # Git commit SHA that produced this image (informational).
    commit_sha: "{{ commit_sha | default('') }}"
    registry_url: "{{ registry_url | default('') }}"
    registry_username: "{{ registry_username | default('') }}"
    registry_password: "{{ registry_password | default('') }}"
    domain: "{{ domain | default('') }}"
    env_vars: "{{ env_vars | default({}) }}"
    max_retries: 5
    retry_delay: 5
    logs_dir: "/var/log/deployments"

  pre_tasks:
    - name: "[PRE] Resolve image reference before log init"
      ansible.builtin.set_fact:
        image_ref: "{{ docker_image_sha if docker_image_sha | length > 0 else docker_image }}"

    - name: "[PRE] Create deployment log directory"
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        mode: '0755'

    - name: "[PRE] Initialize deployment log"
      ansible.builtin.copy:
        content: |
          ==========================================
          Deployment Started: {{ ansible_date_time.iso8601 }}
          Image: {{ image_ref }} (tag: {{ docker_image }}, sha: {{ docker_image_sha | default('n/a') }}, commit: {{ commit_sha | default('n/a') }})
          ==========================================
        dest: "{{ logs_dir }}/deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log"
        mode: '0644'

    - name: "[PRE] Verify Docker is running"
      ansible.builtin.command: docker ps
      register: docker_status
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: docker_status is successful
      changed_when: false

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

  tasks:
    - name: "Pull → Deploy → Configure Nginx"
      block:
        - name: "[0/5] Resolve image reference (prefer immutable SHA digest)"
          ansible.builtin.set_fact:
            image_ref: "{{ docker_image_sha if docker_image_sha | length > 0 else docker_image }}"

        - name: "[1/5] Verify Docker daemon"
          ansible.builtin.command: docker info
          register: docker_info
          changed_when: false
          failed_when: docker_info is failed

        - name: "[2/5] Authenticate to Docker registry"
          ansible.builtin.shell: >-
            echo "{{ registry_password }}" | docker login {{ registry_url }}
            -u {{ registry_username }} --password-stdin
          args:
            executable: /bin/bash
          when: registry_username | length > 0 and registry_password | length > 0
          register: docker_login
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: docker_login is successful
          no_log: true
          changed_when: false

        - name: "[2/5] Pull Docker image (with private registry)"
          ansible.builtin.command:
            argv:
              - docker
              - pull
              - "{{ image_ref }}"
          register: docker_pull
          retries: 3
          delay: "{{ retry_delay }}"
          until: docker_pull is successful
          timeout: 600
          when: registry_username | length > 0 and registry_password | length > 0

        - name: "[2/5] Pull Docker image (public registry)"
          ansible.builtin.command:
            argv:
              - docker
              - pull
              - "{{ image_ref }}"
          register: docker_pull_public
          retries: 3
          delay: "{{ retry_delay }}"
          until: docker_pull_public is successful
          timeout: 600
          when: registry_username | length == 0

        - name: "[2/5] Verify image was pulled successfully"
          ansible.builtin.command:
            argv:
              - docker
              - image
              - inspect
              - "{{ image_ref }}"
          register: docker_inspect
          changed_when: false
          failed_when: docker_inspect is failed

        - name: "[3/5] Create Docker network if not exists"
          community.docker.docker_network:
            name: "{{ container_name }}-network"
            state: present
            driver: bridge

        - name: "[3/5] Backup container metadata before replacement"
          ansible.builtin.shell: |
            if docker ps -a --format '{{"{{"}}.Names{{"}}"}}' | grep -w "{{ container_name }}"; then
              docker inspect "{{ container_name }}" > /tmp/{{ container_name }}-backup.json
            fi
          args:
            executable: /bin/bash
          ignore_errors: true

        - name: "[3/5] Stop and remove old container"
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: absent
          register: old_container_removed
          retries: 3
          delay: "{{ retry_delay }}"
          until: old_container_removed is successful

        - name: "[4/5] Deploy new container"
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ image_ref }}"
            state: started
            restart_policy: always
            pull: never
            published_ports:
              - "{{ app_port }}:{{ app_port }}"
            env: "{{ env_vars }}"
            networks:
              - name: "{{ container_name }}-network"
            healthcheck:
              test: ["CMD-SHELL", "curl -sf --max-time 3 http://localhost:{{ app_port }}/ || wget -q --tries=1 --spider http://localhost:{{ app_port }}/ || exit 1"]
              interval: 30s
              timeout: 5s
              retries: 3
              start_period: 10s
            log_driver: json-file
            log_options:
              max-size: "10m"
              max-file: "3"
          register: container_started
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: container_started is successful

        - name: "[4/5] Verify container is running"
          ansible.builtin.command:
            argv:
              - docker
              - ps
              - "--filter=name={{ container_name }}"
              - "--format={% raw %}{{range .}}{{.Names}}{{end}}{% endraw %}"
          register: running_containers
          changed_when: false
          failed_when: "container_name not in running_containers.stdout"

        - name: "[4/5] Get container details"
          community.docker.docker_container_info:
            name: "{{ container_name }}"
          register: container_info_raw
          changed_when: false

        - name: "[4/5] Extract container IP address"
          ansible.builtin.set_fact:
            container_ip: "{{ container_info_raw.container.NetworkSettings.Networks[container_name ~ '-network'].IPAddress | default('') }}"

        - name: "[5/5] Configure Nginx reverse proxy"
          ansible.builtin.copy:
            dest: /etc/nginx/sites-available/{{ container_name }}
            content: |
              upstream {{ container_name }}_backend {
                server 127.0.0.1:{{ app_port }};
                keepalive 32;
              }

              server {
                listen 80;
                server_name {{ domain if domain|length > 0 else '_' }};
                client_max_body_size 100M;

                location / {
                  proxy_pass http://{{ container_name }}_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  proxy_request_buffering off;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_connect_timeout 7200s;
                }

                location /health {
                  access_log off;
                  proxy_pass http://{{ container_name }}_backend;
                }
              }
            owner: root
            group: root
            mode: '0644'
          register: nginx_config

        - name: "[5/5] Enable Nginx site"
          ansible.builtin.file:
            src: /etc/nginx/sites-available/{{ container_name }}
            dest: /etc/nginx/sites-enabled/{{ container_name }}
            state: link
          notify: Reload Nginx

        - name: "[5/5] Verify Nginx configuration"
          ansible.builtin.command: nginx -t
          register: nginx_test
          changed_when: false
          failed_when: nginx_test is failed

      rescue:
        - name: "[RESCUE] Log deployment failure"
          ansible.builtin.shell: |
            echo "DEPLOY FAILED at $(date): {{ container_name | quote }} with image {{ docker_image | quote }}" \
              >> {{ logs_dir }}/deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
          changed_when: true
          failed_when: false

        - name: "[RESCUE] Inspect container state for diagnostics"
          ansible.builtin.shell: |
            docker ps -a -f "name={{ container_name }}" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" || true
          register: container_state
          changed_when: false
          failed_when: false

        - name: "[RESCUE] Capture last 50 lines of container logs"
          ansible.builtin.shell: |
            docker logs --tail=50 "{{ container_name }}" 2>&1 || true
          register: container_logs
          changed_when: false
          failed_when: false

        - name: "[RESCUE] Fail play with diagnostics"
          ansible.builtin.fail:
            msg: >
              Deploy failed for {{ container_name }} (image: {{ docker_image }}).
              Container state: {{ container_state.stdout | default('N/A') }}
              Last logs: {{ container_logs.stdout | default('N/A') | truncate(2000) }}

  post_tasks:
    - name: "[POST] Wait for application to be healthy"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: [200, 301, 302, 401, 403, 404]
        timeout: 5
      register: healthcheck
      retries: 15
      delay: "{{ retry_delay }}"
      until: healthcheck is successful
      failed_when: false

    - name: "[POST] Display container information"
      ansible.builtin.shell: |
        docker ps -f "name={{ container_name }}" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
      register: container_info_table
      changed_when: false

    - name: "[POST] Log deployment completion"
      ansible.builtin.shell: |
        echo "Deployment completed at $(date)" >> {{ logs_dir }}/deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
      changed_when: true

    - name: "[POST] Display deployment summary"
      ansible.builtin.debug:
        msg: |
          ✅ DEPLOYMENT SUCCESSFUL
          
          {{ container_info_table.stdout }}
          
          Container Network: {{ container_name }}-network
          Container IP: {{ container_ip | default('N/A') }}
          Application Port: {{ app_port }}
          Nginx: CONFIGURED
          Health Status: {{ 'HEALTHY' if healthcheck is succeeded else 'STARTING' }}
          
          URLs:
            - HTTP: http://127.0.0.1:{{ app_port }}
            - Nginx: http://localhost (if domain={{ domain }})
          
          Logs:
            - Deployment: {{ logs_dir }}/deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
            - Container: docker logs {{ container_name }}
            - Nginx: tail -f /var/log/nginx/access.log

    - name: "[POST] Cleanup old images (keep latest 3)"
      ansible.builtin.shell: |
        CURRENT_IMAGE="{{ docker_image | quote }}"
        docker images --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}" | \
        grep "${CURRENT_IMAGE%:*}" | awk '{print $2}' | \
        tail -n +4 | xargs -r docker rmi -f 2>/dev/null || true
      register: cleanup
      changed_when: cleanup.stdout != ''
      failed_when: false
