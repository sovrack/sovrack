---
# Buildpacks deployment via the `pack` CLI — like Dokploy's Buildpacks option.
#
# This is the classic Cloud Native Buildpacks (CNB) approach. Useful when:
#   - You have a Heroku-style app
#   - You want a vendor-neutral build (not Railway-specific like Nixpacks)
#   - You have private buildpacks or a custom builder image
#
# This playbook:
#   1. Installs the `pack` CLI (idempotent)
#   2. Clones the git repository on the VPS
#   3. Runs `pack build` with a configurable builder image
#   4. Deploys the image with blue-green zero-downtime
#
# Required extra-vars:
#   repo_url        Git clone URL
#   repo_branch     Branch to build
#   container_name  Canonical container name
#   app_port        Port exposed by the app
#   image_tag       Docker image tag
#
# Optional:
#   git_token         PAT for HTTPS clone
#   builder_image     CNB builder image (default: paketobuildpacks/builder-jammy-base)
#   build_env         Dict of env vars for the build phase
#   runtime_env       Dict of env vars baked into the image
#   health_check_path Healthcheck path (default: /health)
#   domain            Domain for Nginx vhost

- name: Buildpacks build — clone, build, deploy (zero-downtime)
  hosts: targets
  become: true

  vars:
    # Static defaults — extra-vars passed by the backend take precedence.
    container_name: "deploy-app"
    app_port: 3000
    repo_url: ""
    repo_branch: "main"
    image_tag: "deploy-app:main"
    git_token: ""
    builder_image: "paketobuildpacks/builder-jammy-base"
    build_env: {}
    runtime_env: {}
    health_check_path: "/health"
    domain: ""
    max_retries: 5
    retry_delay: 5
    logs_dir: "/var/log/deployments"

    # Internal
    workspace: "/opt/platform-builds/{{ container_name }}"
    green_name: "{{ container_name }}-candidate"
    green_port: "{{ (app_port | int) + 10000 }}"
    network_name: "{{ container_name }}-network"
    pack_bin: "/usr/local/bin/pack"

  pre_tasks:
    - name: "[PRE] Create build workspace"
      ansible.builtin.file:
        path: "{{ workspace }}"
        state: directory
        mode: '0755'

    - name: "[PRE] Create log directory"
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        mode: '0755'

    - name: "[PRE] Record existing image for rollback reference"
      ansible.builtin.shell: |
        docker inspect --format='{{"{{"}}{{".Config.Image"}}{{"}}"}}' {{ container_name }} 2>/dev/null || echo "none"
      register: blue_image_result
      changed_when: false

    - name: "[PRE] Set blue_image fact"
      ansible.builtin.set_fact:
        blue_image: "{{ blue_image_result.stdout | trim }}"

    - name: "[PRE] Check pack CLI binary exists"
      ansible.builtin.stat:
        path: "{{ pack_bin }}"
      register: pre_pack_stat

    - name: "[PRE] Fail if pack CLI is not installed"
      ansible.builtin.fail:
        msg: >
          pack CLI not found at {{ pack_bin }}.
          Run server preparation with the 'buildpacks' role enabled, or install manually:
          curl -fsSL https://github.com/buildpacks/pack/releases/download/v0.36.4/pack-v0.36.4-linux.tgz | tar -xz -C /tmp && install -m 0755 /tmp/pack {{ pack_bin }}
      when: not pre_pack_stat.stat.exists

  tasks:
    - name: "Verify → Clone → Build → Deploy (blue-green)"
      block:
        - name: "[1/4] Verify pack CLI version"
          ansible.builtin.command: "{{ pack_bin }} --version"
          register: pack_version_check
          changed_when: false
          failed_when: pack_version_check.rc != 0

        # ── Clone ──────────────────────────────────────────────────────────
        - name: "[2/4] Display clone source (token masked)"
          ansible.builtin.debug:
            msg: >-
              Cloning from {% if '@' in repo_url %}https://***@{{
                repo_url | regex_replace('^https?://[^@]+@', '')
              }}{% else %}{{ repo_url }}{% endif %}
              Branch: {{ repo_branch }}
          when: git_token | length > 0

        - name: "[2/4] Display clone source (no token)"
          ansible.builtin.debug:
            msg: "Cloning from {{ repo_url }} / branch {{ repo_branch }}"
          when: git_token | length == 0

        - name: "[2/4] Inject token into clone URL"
          ansible.builtin.set_fact:
            authenticated_url: >-
              {% if '://' in repo_url %}
              {{ repo_url.split('://', 1)[0] }}://oauth2:{{ git_token }}@{{ repo_url.split('://', 1)[1] }}
              {% else %}
              https://oauth2:{{ git_token }}@{{ repo_url }}
              {% endif %}
          no_log: true

        - name: "[2/4] Remove stale workspace"
          ansible.builtin.file:
            path: "{{ workspace }}"
            state: absent

        - name: "[2/4] Clone repository (shallow)"
          ansible.builtin.git:
            repo: "{{ authenticated_url }}"
            dest: "{{ workspace }}"
            version: "{{ repo_branch }}"
            depth: 1
            force: true
          no_log: true

        # ── Buildpacks build ───────────────────────────────────────────────
        - name: "[3/4] Build image with pack CLI"
          ansible.builtin.shell: |
            {% set env_args = '' %}
            {% for key, val in build_env.items() %}
            {% set env_args = env_args + ' --env ' + key + '=$' + key %}
            {% endfor %}
            cd {{ workspace }}
            {{ pack_bin }} build {{ image_tag }} \
              --builder {{ builder_image }} \
              --path . \
              --publish=false \
              {{ env_args }}
          args:
            executable: /bin/bash
          environment:
            PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          register: pack_build
          timeout: 1800
          no_log: false

        # ── Blue-green deploy ──────────────────────────────────────────────
        - name: "[4/4] Ensure Docker network exists"
          community.docker.docker_network:
            name: "{{ network_name }}"
            state: present
            driver: bridge

        - name: "[4/4] Remove stale candidate container"
          community.docker.docker_container:
            name: "{{ green_name }}"
            state: absent
          failed_when: false

        - name: "[4/4] Start GREEN candidate on port {{ green_port }}"
          community.docker.docker_container:
            name: "{{ green_name }}"
            image: "{{ image_tag }}"
            state: started
            restart_policy: "no"
            pull: never
            published_ports:
              - "{{ green_port }}:{{ app_port }}"
            env: "{{ runtime_env }}"
            networks:
              - name: "{{ network_name }}"
            log_driver: json-file
            log_options:
              max-size: "10m"
              max-file: "3"

        - name: "[4/4] Health-check GREEN candidate"
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ green_port }}{{ health_check_path }}"
            method: GET
            status_code: [200, 301, 302, 401, 403, 404]
            timeout: 5
          register: green_health
          retries: 10
          delay: 5
          until: green_health is successful

        # ── Promote ───────────────────────────────────────────────────────
        - name: "[4/4] Configure Nginx for GREEN port"
          ansible.builtin.copy:
            dest: /etc/nginx/sites-available/{{ container_name }}
            content: |
              upstream {{ container_name }}_backend {
                server 127.0.0.1:{{ green_port }};
                keepalive 32;
              }
              server {
                listen 80;
                server_name {{ domain if domain | length > 0 else '_' }};
                client_max_body_size 100M;
                location / {
                  proxy_pass http://{{ container_name }}_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_cache_bypass $http_upgrade;
                  proxy_read_timeout 3600s;
                }
                location {{ health_check_path }} {
                  access_log off;
                  proxy_pass http://{{ container_name }}_backend;
                }
              }
            mode: '0644'

        - name: "[4/4] Enable Nginx site"
          ansible.builtin.file:
            src: /etc/nginx/sites-available/{{ container_name }}
            dest: /etc/nginx/sites-enabled/{{ container_name }}
            state: link

        - name: "[4/4] Reload Nginx to GREEN"
          ansible.builtin.service:
            name: nginx
            state: reloaded

        - name: "[4/4] Stop BLUE container"
          community.docker.docker_container:
            name: "{{ container_name }}"
            state: absent
          failed_when: false

        - name: "[4/4] Promote GREEN → canonical name"
          ansible.builtin.command: "docker rename {{ green_name }} {{ container_name }}"
          changed_when: true

        - name: "[4/4] Set restart policy to always"
          ansible.builtin.command: "docker update --restart=always {{ container_name }}"
          changed_when: true

      rescue:
        - name: "[ROLLBACK] Capture real failure info"
          ansible.builtin.set_fact:
            _failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
            _failed_result: >-
              {{
                (ansible_failed_result.msg | default(''))
                | regex_replace('oauth2:[^@]+@', 'oauth2:***@')
                | regex_replace('://[^:]+:[^@]+@', '://***:***@')
              }}
          failed_when: false

        - name: "[ROLLBACK] Write build logs to file"
          ansible.builtin.copy:
            dest: "{{ logs_dir }}/{{ container_name }}-fail.log"
            content: |
              Timestamp: {{ ansible_date_time.iso8601 }}
              Image tag: {{ image_tag }}
              Branch: {{ repo_branch }}
              Builder: {{ builder_image }}
              Failed task: {{ _failed_task }}

              === pack_build.stdout ===
              {{ pack_build.stdout | default('(task not reached)') }}
              === pack_build.stderr ===
              {{ pack_build.stderr | default('(task not reached)') }}
              === pack_version_check.stdout ===
              {{ pack_version_check.stdout | default('(task not reached)') }}
              === green_health.msg ===
              {{ green_health.msg | default('(task not reached)') }}
              === Failed result ===
              {{ _failed_result }}
            mode: '0644'
          failed_when: false

        - name: "[ROLLBACK] Stop failed candidate"
          community.docker.docker_container:
            name: "{{ green_name }}"
            state: absent
          failed_when: false

        - name: "[ROLLBACK] Fail with rollback message"
          ansible.builtin.fail:
            msg: |
              🔴 BUILDPACKS BUILD FAILED
              Failed task : {{ _failed_task }}
              Details     : {{ _failed_result | truncate(500) }}
              Log file    : {{ logs_dir }}/{{ container_name }}-fail.log
              Rollback    : Previous container kept running.

  post_tasks:
    - name: "[POST] Cleanup workspace"
      ansible.builtin.file:
        path: "{{ workspace }}"
        state: absent

    - name: "[POST] Remove old build images (keep latest 2)"
      ansible.builtin.shell: |
        docker images --format '{{.Repository}}:{{.Tag}}\t{{.ID}}' | \
        grep "^{{ image_tag | regex_replace(':.*', '') }}:" | \
        awk '{print $2}' | tail -n +3 | xargs -r docker rmi -f 2>/dev/null || true
      changed_when: false
      failed_when: false

    - name: "[POST] Summary"
      ansible.builtin.debug:
        msg: |
          ✅ BUILDPACKS BUILD + BLUE-GREEN DEPLOY SUCCESSFUL
          Image: {{ image_tag }}
          Container: {{ container_name }}
          Branch: {{ repo_branch }}
          Builder: {{ builder_image }}
          Pack: {{ pack_version_check.stdout | trim }}
          Previous: {{ blue_image }}
