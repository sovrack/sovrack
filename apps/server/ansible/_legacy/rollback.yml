---
- name: Rollback applicatif via Docker (Production-Safe)
  hosts: targets
  become: true
  vars:
    container_name: "{{ container_name | default('deploy-app') }}"
    app_port: "{{ app_port | default(3000) }}"
    docker_image: "{{ docker_image }}"
    registry_url: "{{ registry_url | default('') }}"
    registry_username: "{{ registry_username | default('') }}"
    registry_password: "{{ registry_password | default('') }}"
    max_retries: 5
    retry_delay: 5
    logs_dir: "/var/log/deployments"

  pre_tasks:
    - name: "[PRE] Ensure rollback log directory exists"
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        mode: '0755'

    - name: "[PRE] Log rollback start"
      ansible.builtin.copy:
        content: |
          ==========================================
          ROLLBACK INITIATED: {{ ansible_date_time.iso8601 }}
          Image: {{ docker_image }}
          ==========================================
        dest: "{{ logs_dir }}/rollback-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log"
        mode: '0644'

    - name: "[PRE] Create backup of current container state"
      ansible.builtin.shell: |
        mkdir -p /tmp/rollback-backups
        if docker ps -a --filter="name={{ container_name }}" --format='{{"{{"}}.Names{{"}}"}}' | grep -q "{{ container_name }}"; then
          docker inspect "{{ container_name }}" > /tmp/rollback-backups/{{ container_name }}-before-rollback-{{ ansible_date_time.iso8601 }}.json
          echo "Current container state backed up"
        fi
      args:
        executable: /bin/bash
      register: backup_created
      changed_when: "'backed up' in backup_created.stdout"

  tasks:
    - name: "[1/4] Verify Docker is running"
      ansible.builtin.command: docker ps
      register: docker_check
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: docker_check is successful
      changed_when: false

    - name: "[2/4] Authenticate to registry if needed"
      ansible.builtin.shell: >-
        echo "{{ registry_password }}" | docker login {{ registry_url }}
        -u {{ registry_username }} --password-stdin
      args:
        executable: /bin/bash
      when: registry_username | length > 0 and registry_password | length > 0
      register: registry_login
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: registry_login is successful
      no_log: true
      changed_when: false

    - name: "[2/4] Pull rollback image"
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ docker_image }}"
      register: image_pull
      retries: 3
      delay: "{{ retry_delay }}"
      until: image_pull is successful
      timeout: 600

    - name: "[2/4] Verify image exists locally"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ docker_image }}"
      changed_when: false
      failed_when: false

    - name: "[3/4] Stop current container gracefully"
      ansible.builtin.command:
        argv:
          - docker
          - stop
          - -t
          - "30"
          - "{{ container_name }}"
      register: stop_container
      ignore_errors: true
      changed_when: stop_container is succeeded

    - name: "[3/4] Wait for graceful shutdown"
      ansible.builtin.pause:
        seconds: 5

    - name: "[3/4] Force remove container if still running"
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ container_name }}"
      register: remove_container
      retries: 3
      delay: "{{ retry_delay }}"
      until: remove_container is successful
      changed_when: remove_container is succeeded
      failed_when: false

    - name: "[4/4] Start rollback container"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        pull: never
        published_ports:
          - "{{ app_port }}:{{ app_port }}"
        healthcheck:
          test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:{{ app_port }}/"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 10s
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"
      register: rollback_container
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: rollback_container is successful

  post_tasks:
    - name: "[POST] Verify container is running"
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - -f
          - "name={{ container_name }}"
          - "--format={% raw %}{{.Names}}{% endraw %}"
      register: verify_running
      changed_when: false
      failed_when: "container_name not in verify_running.stdout"

    - name: "[POST] Wait for application to be healthy"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: [200, 301, 302, 401, 403, 404]
        timeout: 5
      register: health_check
      retries: 20
      delay: "{{ retry_delay }}"
      until: health_check is successful
      failed_when: false

    - name: "[POST] Verify Nginx is working"
      ansible.builtin.command: "nginx -t"
      register: nginx_test
      changed_when: false

    - name: "[POST] Log rollback completion"
      ansible.builtin.shell: |
        echo "Rollback completed successfully at $(date)" >> {{ logs_dir }}/rollback-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
        echo "Container Status: HEALTHY" >> {{ logs_dir }}/rollback-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
      changed_when: true

    - name: "[POST] Display rollback summary"
      ansible.builtin.debug:
        msg: |
          ✅ ROLLBACK SUCCESSFUL
          
          Image: {{ docker_image }}
          Container: {{ container_name }}
          Port: {{ app_port }}
          Status: {{ 'HEALTHY' if health_check is succeeded else 'STARTING' }}
          
          Backup location:
            /tmp/rollback-backups/{{ container_name }}-before-rollback-{{ ansible_date_time.iso8601 }}.json
          
          Logs:
            - Rollback: {{ logs_dir }}/rollback-{{ ansible_date_time.date }}-{{ ansible_date_time.time }}.log
            - Container: docker logs {{ container_name }}
          
          Next: Monitor application with: docker logs -f {{ container_name }}
