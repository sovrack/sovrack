---
- name: Deploiement applicatif via Docker
  hosts: targets
  become: true
  vars:
    container_name: "{{ container_name | default('deploy-app') }}"
    app_port: "{{ app_port | default(3000) }}"
    docker_image: "{{ docker_image }}"
    registry_url: "{{ registry_url | default('') }}"
    registry_username: "{{ registry_username | default('') }}"
    registry_password: "{{ registry_password | default('') }}"
    domain: "{{ domain | default('') }}"
    env_vars: "{{ env_vars | default({}) }}"

  tasks:
    - name: Verifier le daemon Docker
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false

    - name: Pull de la nouvelle image
      ansible.builtin.command: "docker pull {{ docker_image }}"
      when: registry_username | length == 0 or registry_password | length == 0

    - name: Connexion au registry Docker
      ansible.builtin.command: >-
        docker login {{ registry_url }} -u {{ registry_username }} -p {{ registry_password }}
      when: registry_username | length > 0 and registry_password | length > 0
      no_log: true

    - name: Pull de la nouvelle image avec registry authentifie
      ansible.builtin.command: "docker pull {{ docker_image }}"
      when: registry_username | length > 0 and registry_password | length > 0

    - name: Supprimer ancien container si present
      ansible.builtin.shell: |
        if docker ps -a --format '{{"{{"}}.Names{{"}}"}}' | grep -w {{ container_name }}; then
          docker rm -f {{ container_name }}
        fi
      args:
        executable: /bin/bash

    - name: Demarrer nouveau container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        pull: never
        published_ports:
          - "{{ app_port }}:{{ app_port }}"
        env: "{{ env_vars }}"

    - name: Installer Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configurer reverse proxy Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/{{ container_name }}
        content: |
          server {
            listen 80;
            server_name {{ domain if domain|length > 0 else '_' }};

            location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
            }
          }

    - name: Activer vhost Nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ container_name }}
        dest: /etc/nginx/sites-enabled/{{ container_name }}
        state: link
      notify:
        - Reload Nginx

    - name: Healthcheck de l'application
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}"
        method: GET
        status_code: [200, 301, 302, 401, 403, 404]
      register: healthcheck
      retries: 10
      delay: 3
      until: healthcheck.status is defined

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
