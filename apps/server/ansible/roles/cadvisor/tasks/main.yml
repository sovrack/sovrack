---
- name: "cadvisor | Ensure Docker is available"
  ansible.builtin.command: docker --version
  changed_when: false

# ── Détection préalable (portabilité TOUS environnements) ────────────────────
# cAdvisor se connecte au socket Docker en lecture et lit la hiérarchie cgroup.
# Le mode privilégié n'est pas nécessaire pour les métriques de base utilisées
# par Sovrack et donnerait un contrôle hôte disproportionné au collecteur.
- name: "cadvisor | Detect cgroup v2 (unified hierarchy)"
  ansible.builtin.stat:
    path: /sys/fs/cgroup/cgroup.controllers
  register: cadvisor_cgroup2

- name: "cadvisor | Report detected environment"
  ansible.builtin.debug:
    msg: >-
      cgroup {{ 'v2 (unified)' if cadvisor_cgroup2.stat.exists else 'v1 (legacy)' }}
      → cAdvisor lancé sans privilège étendu ni /dev/kmsg.

- name: "cadvisor | Ensure the monitoring Docker network exists"
  ansible.builtin.command: docker network create {{ monitoring_docker_network }}
  register: cadvisor_network
  failed_when: >
    cadvisor_network.rc != 0 and
    'already exists' not in cadvisor_network.stderr
  changed_when: cadvisor_network.rc == 0

- name: "cadvisor | Remove previous container if present"
  ansible.builtin.shell: docker rm -f cadvisor >/dev/null 2>&1 || true
  changed_when: false

# Arguments construits dynamiquement. /dev/kmsg n'est pas requis pour les
# métriques Docker utilisées ici et n'est donc pas transmis au conteneur.
- name: "cadvisor | Build portable run arguments"
  ansible.builtin.set_fact:
    cadvisor_run_argv: >-
      {{
        cadvisor_base_argv + cadvisor_tail_argv
      }}
  vars:
    cadvisor_base_argv:
      - docker
      - run
      - -d
      - --name
      - cadvisor
      - --restart
      - unless-stopped
      - --read-only
      - --security-opt
      - no-new-privileges:true
      - --cap-drop
      - ALL
      - --pids-limit
      - "256"
      - --network
      - "{{ monitoring_docker_network }}"
    cadvisor_tail_argv:
      - --volume=/:/rootfs:ro
      # Le socket Docker fournit les noms et labels des conteneurs sans exposer
      # tous les autres sockets présents sous /var/run.
      - --volume=/var/run/docker.sock:/var/run/docker.sock:ro
      - --volume=/sys:/sys:ro
      - --volume=/var/lib/docker/:/var/lib/docker:ro
      - --publish
      - "{{ cadvisor_bind_address }}:{{ cadvisor_port }}:8080"
      - "{{ cadvisor_image }}"

- name: "cadvisor | Run cAdvisor container"
  ansible.builtin.command:
    argv: "{{ cadvisor_run_argv }}"
  register: cadvisor_run
  changed_when: cadvisor_run.rc == 0
