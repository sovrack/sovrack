---
- name: "monitoring | Install packages"
  ansible.builtin.package:
    name: "{{ monitoring_packages }}"
    state: present

- name: "monitoring | Enable sysstat when installed"
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    create: true
    mode: '0644'
  when: monitoring_enable_sysstat | bool and ansible_os_family == 'Debian'
  notify: restart sysstat
