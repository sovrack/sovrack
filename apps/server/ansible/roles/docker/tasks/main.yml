---
- name: "docker | Install prerequisites on Debian"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: "docker | Create apt keyring directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_os_family == 'Debian'

- name: "docker | Download Docker GPG key"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: "docker | Configure Docker repository"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_os_family == 'Debian'

- name: "docker | Install Docker packages"
  ansible.builtin.package:
    name: "{{ ['docker-ce', 'docker-ce-cli', 'containerd.io'] + (['docker-compose-plugin'] if docker_install_compose_plugin | bool else []) }}"
    state: present

- name: "docker | Ensure daemon config directory exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "docker | Write daemon.json when options are provided"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0644'
  when: docker_daemon_options | length > 0
  notify: restart docker

- name: "docker | Enable and start service"
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: "docker | Add configured users to docker group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  failed_when: false
