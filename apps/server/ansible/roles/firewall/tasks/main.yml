---
- name: "firewall | Install UFW"
  ansible.builtin.package:
    name: ufw
    state: present

- name: "firewall | Configure and enable UFW (when firewall_enabled)"
  when: firewall_enabled | bool
  block:
    - name: "firewall | Set incoming policy"
      community.general.ufw:
        direction: incoming
        policy: "{{ firewall_default_incoming }}"

    - name: "firewall | Set outgoing policy"
      community.general.ufw:
        direction: outgoing
        policy: "{{ firewall_default_outgoing }}"

    - name: "firewall | Allow required ports"
      community.general.ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}"
        proto: "{{ item.split('/')[1] | default('tcp') }}"
      loop: "{{ firewall_allowed_ports }}"

    - name: "firewall | Allow SSH from the configured administration CIDR"
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port | string }}"
        proto: tcp
        from_ip: "{{ firewall_ssh_allowed_cidr }}"
      when: firewall_ssh_allowed_cidr | length > 0

    - name: "firewall | Allow SSH without a source restriction when no CIDR is configured"
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port | string }}"
        proto: tcp
      when: firewall_ssh_allowed_cidr | length == 0

    - name: "firewall | Enable UFW"
      community.general.ufw:
        state: enabled

- name: "firewall | Preserve existing firewall state when explicitly disabled"
  when: not (firewall_enabled | bool)
  ansible.builtin.debug:
    msg: "Firewall management was explicitly disabled; existing host rules were not changed."
