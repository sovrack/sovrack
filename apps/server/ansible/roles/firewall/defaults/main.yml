---
# Production-safe default. A caller may opt out only for an isolated disposable
# development host; opting out never actively disables an existing firewall.
firewall_enabled: true
firewall_allowed_ports:
  - '80/tcp'
  - '443/tcp'
firewall_ssh_port: 22
# Optional CIDR allowed to reach SSH. Empty preserves remote access from any
# source and avoids locking out first-time provisioning.
firewall_ssh_allowed_cidr: ''
firewall_default_incoming: deny
firewall_default_outgoing: allow
