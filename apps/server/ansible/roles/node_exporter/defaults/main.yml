---
node_exporter_port: 9100
node_exporter_image: prom/node-exporter:v1.8.2
# Shared bridge network so Prometheus can reach Node Exporter by container
# name instead of the host — container-to-container traffic never crosses
# the host firewall (UFW), unlike the previous host.docker.internal setup.
monitoring_docker_network: deployautomation_monitoring
