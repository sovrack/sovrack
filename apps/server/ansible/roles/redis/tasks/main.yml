---
# Redis en conteneur Docker, piloté via community.docker.docker_container
# (module idempotent : ne recrée le conteneur que si sa config a changé).
# Nécessite le SDK Python Docker côté cible, délégué au rôle commun docker_sdk
# (mutualisé avec postgres et traefik).
# Exécuté en become (root). Les données vivent dans un volume nommé → une
# éventuelle recréation ne les perd pas.

- name: "redis | Vérifier que Docker est disponible"
  ansible.builtin.command: docker info
  register: _redis_docker
  changed_when: false
  failed_when: _redis_docker.rc != 0

- name: "redis | Prérequis SDK Python Docker"
  ansible.builtin.include_role:
    name: docker_sdk

- name: "redis | Réseau Docker partagé '{{ redis_network }}'"
  ansible.builtin.command: "docker network create {{ redis_network }}"
  register: _redis_net
  changed_when: _redis_net.rc == 0
  failed_when: >-
    _redis_net.rc != 0 and 'already exists' not in (_redis_net.stderr | default(''))

- name: "redis | Volume de données persistant '{{ redis_volume }}'"
  ansible.builtin.command: "docker volume create {{ redis_volume }}"
  changed_when: false # idempotent (docker renvoie le nom du volume, rc 0)

- name: "redis | Conteneur Redis (idempotent, AOF persistant)"
  community.docker.docker_container:
    name: "{{ redis_container_name }}"
    image: "{{ redis_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: "{{ redis_network }}"
    published_ports:
      - "127.0.0.1:{{ redis_port }}:6379"
    volumes:
      - "{{ redis_volume }}:/data"
    command: "{{ ['redis-server', '--appendonly', 'yes'] + (['--requirepass', redis_password] if (redis_password | default('') | length > 0) else []) }}"
  no_log: "{{ (redis_password | default('') | length > 0) }}" # masque le mot de passe s'il y en a un
