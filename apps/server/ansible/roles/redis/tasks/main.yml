---
# Redis en conteneur Docker. Piloté via la CLI docker (pas de dépendance au SDK
# Python docker côté cible), même pattern éprouvé que les rôles traefik/prometheus.
# Exécuté en become (root). Les données vivent dans un volume nommé → un
# rm -f / run de recréation ne les perd pas.

- name: "redis | Vérifier que Docker est disponible"
  ansible.builtin.command: docker info
  register: _redis_docker
  changed_when: false
  failed_when: _redis_docker.rc != 0

- name: "redis | Réseau Docker partagé '{{ redis_network }}'"
  ansible.builtin.command: "docker network create {{ redis_network }}"
  register: _redis_net
  changed_when: _redis_net.rc == 0
  failed_when: >-
    _redis_net.rc != 0 and 'already exists' not in (_redis_net.stderr | default(''))

- name: "redis | Volume de données persistant '{{ redis_volume }}'"
  ansible.builtin.command: "docker volume create {{ redis_volume }}"
  changed_when: false # idempotent (docker renvoie le nom du volume, rc 0)

- name: "redis | (Re)créer le conteneur Redis (AOF persistant)"
  ansible.builtin.shell:
    cmd: |
      set -e
      docker rm -f {{ redis_container_name }} >/dev/null 2>&1 || true
      docker run -d --name {{ redis_container_name }} --restart unless-stopped \
        --network {{ redis_network }} \
        -p 127.0.0.1:{{ redis_port }}:6379 \
        -v {{ redis_volume }}:/data \
        {{ redis_image }} \
        redis-server --appendonly yes{{ (" --requirepass '" ~ redis_password ~ "'") if (redis_password | default('') | length > 0) else "" }}
  changed_when: true
  no_log: "{{ (redis_password | default('') | length > 0) }}" # masque le mot de passe s'il y en a un
