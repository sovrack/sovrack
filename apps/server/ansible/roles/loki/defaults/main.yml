---
# Loki — stockage + recherche de logs runtime centralisés.
loki_image: grafana/loki:3.1.1
loki_port: 3100
loki_config_dir: /opt/monitoring/loki
loki_storage_dir: /opt/monitoring/loki/data
# Rétention des logs (garde-fou disque). 168h = 7 jours.
loki_retention_period: 168h

# Promtail — découvre les conteneurs Docker et expédie leurs logs vers Loki,
# en propageant les labels `deployautomation.*` (relabeling) pour filtrer par service×env.
promtail_image: grafana/promtail:3.1.1
promtail_config_dir: /opt/monitoring/promtail

# Shared bridge network so Promtail can push to Loki by container name
# instead of 127.0.0.1 (each container has its own network namespace, so
# 127.0.0.1 inside Promtail's container is Promtail itself, never Loki).
monitoring_docker_network: deployautomation_monitoring
