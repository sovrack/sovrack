---
- name: "loki | Ensure Docker is available"
  ansible.builtin.command: docker --version
  changed_when: false

- name: "loki | Create config directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ loki_config_dir }}"
    - "{{ promtail_config_dir }}"

- name: "loki | Create storage directory"
  ansible.builtin.file:
    path: "{{ loki_storage_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "loki | Render Loki configuration"
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_config_dir }}/loki-config.yml"
    owner: root
    group: root
    mode: '0644'

- name: "loki | Render Promtail configuration"
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ promtail_config_dir }}/promtail-config.yml"
    owner: root
    group: root
    mode: '0644'

- name: "loki | Remove previous Loki container if present"
  ansible.builtin.shell: docker rm -f loki >/dev/null 2>&1 || true
  changed_when: false

- name: "loki | Run Loki container"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - loki
      - --restart
      - unless-stopped
      - --publish
      - "{{ loki_port }}:{{ loki_port }}"
      - --volume
      - "{{ loki_config_dir }}/loki-config.yml:/etc/loki/loki-config.yml:ro"
      - --volume
      - "{{ loki_storage_dir }}:/loki"
      - "{{ loki_image }}"
      - -config.file=/etc/loki/loki-config.yml
  register: loki_run
  changed_when: loki_run.rc == 0

- name: "loki | Remove previous Promtail container if present"
  ansible.builtin.shell: docker rm -f promtail >/dev/null 2>&1 || true
  changed_when: false

- name: "loki | Run Promtail container (Docker SD → ship container logs)"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - promtail
      - --restart
      - unless-stopped
      - --volume
      - "{{ promtail_config_dir }}/promtail-config.yml:/etc/promtail/promtail-config.yml:ro"
      - --volume
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - --volume
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "{{ promtail_image }}"
      - -config.file=/etc/promtail/promtail-config.yml
  register: promtail_run
  changed_when: promtail_run.rc == 0

- name: "loki | Wait for Loki to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ loki_port }}/ready"
    status_code: [200, 503]
  register: loki_ready
  retries: 10
  delay: 3
  until: loki_ready.status == 200
  changed_when: false
