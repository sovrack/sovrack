---
- name: "fail2ban | Install package"
  ansible.builtin.package:
    name: fail2ban
    state: present

# Le control node (la plateforme) est le client SSH : on le whitelist pour qu'il
# ne soit jamais banni par ses propres déploiements répétés.
- name: "fail2ban | Detect control-node (SSH client) IP"
  ansible.builtin.set_fact:
    fail2ban_control_ip: "{{ (ansible_env.SSH_CLIENT | default('')).split() | first | default('') }}"

- name: "fail2ban | Build effective ignoreip (defaults + control node)"
  ansible.builtin.set_fact:
    fail2ban_ignoreip_effective: >-
      {{ (fail2ban_ignoreip ~ (' ' ~ fail2ban_control_ip if fail2ban_control_ip | length > 0 else '')) | trim }}

- name: "fail2ban | Configure sshd jail"
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: "fail2ban | Enable and start service"
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
