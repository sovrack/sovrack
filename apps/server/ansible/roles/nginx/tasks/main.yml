---
- name: "nginx | Install package"
  ansible.builtin.package:
    name: nginx
    state: present

- name: "nginx | Ensure web root exists"
  ansible.builtin.file:
    path: "{{ nginx_default_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  when: ansible_os_family == 'Debian'

- name: "nginx | Deploy default site"
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'
  notify: reload nginx

- name: "nginx | Enable default site"
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  when: ansible_os_family == 'Debian'
  notify: reload nginx

- name: "nginx | Validate config"
  ansible.builtin.command: nginx -t
  changed_when: false

- name: "nginx | Enable and start service"
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
