---
- name: "swap | Check existing swap file"
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file

- name: "swap | Create swap file when missing"
  ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
  args:
    creates: "{{ swap_file_path }}"
  when: not swap_file.stat.exists

- name: "swap | Secure swap file permissions"
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: '0600'

- name: "swap | Format swap file if inactive"
  ansible.builtin.command: "mkswap {{ swap_file_path }}"
  when: not swap_file.stat.exists

- name: "swap | Enable swap"
  ansible.builtin.command: "swapon {{ swap_file_path }}"
  register: swapon_result
  changed_when: swapon_result.rc == 0
  failed_when: swapon_result.rc not in [0, 255]

- name: "swap | Persist in fstab"
  ansible.builtin.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    passno: '0'
    dump: '0'
    state: present

- name: "swap | Configure swappiness"
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    state: present
    reload: true
