---
# SDK Python Docker — prérequis du module idempotent community.docker.docker_container,
# utilisé par les rôles postgres/redis/traefik. Mutualisé ici pour éviter la triplication.

- name: "docker_sdk | pip3 disponible (requis par community.docker.docker_container)"
  ansible.builtin.package:
    name: python3-pip
    state: present

# Version PINNÉE volontairement. Avec `state: present` sur `docker` seul, une
# box qui a déjà `requests>=2.32` + un vieux SDK `docker` (<7.0) casse avec
# « Error while fetching server API version: Not supported URL scheme
# http+docker » — l'adaptateur de transport du SDK ne supporte plus le schéma.
# Le SDK `docker` 7.1.0 a corrigé cette incompatibilité. On force donc une
# paire cohérente (idempotent : pip n'agit que si la version installée diffère).
- name: "docker_sdk | SDK Python Docker (requis par community.docker.docker_container)"
  ansible.builtin.pip:
    name:
      - "docker>=7.1.0"
      - "requests>=2.32.2"
    state: present
