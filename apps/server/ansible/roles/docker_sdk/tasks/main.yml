---
# SDK Python Docker — prérequis du module idempotent community.docker.docker_container,
# utilisé par les rôles postgres/redis/traefik. Mutualisé ici pour éviter la triplication.

- name: "docker_sdk | pip3 disponible (requis par community.docker.docker_container)"
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: "docker_sdk | SDK Python Docker (requis par community.docker.docker_container)"
  ansible.builtin.pip:
    name: docker
    state: present
