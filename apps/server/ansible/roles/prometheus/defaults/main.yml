---
prometheus_image: prom/prometheus:v2.54.1
prometheus_port: 9090
prometheus_bind_address: 127.0.0.1
prometheus_config_dir: /opt/monitoring/prometheus
prometheus_storage_dir: /opt/monitoring/prometheus/data
prometheus_scrape_interval: 15s
# node_exporter, cAdvisor and Alertmanager are all containers on the shared
# monitoring network: reach them by container name, resolved by Docker's
# embedded DNS — never through the host's public network stack/firewall.
prometheus_target_node_exporter: "node_exporter:9100"
prometheus_target_cadvisor: "cadvisor:8080"
prometheus_target_alertmanager: "alertmanager:9093"
# Shared bridge network so Prometheus can reach cAdvisor/Alertmanager by
# container name instead of 127.0.0.1 (each container has its own network
# namespace, so 127.0.0.1 only ever means "this same container").
monitoring_docker_network: deployautomation_monitoring
