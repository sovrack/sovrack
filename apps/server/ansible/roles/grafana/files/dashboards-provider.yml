# Managed by Ansible (grafana role) — loads dashboards from the mounted folder.
apiVersion: 1
providers:
  - name: Deploy Automation
    orgId: 1
    folder: Deploy Automation
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
