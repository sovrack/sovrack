---
- name: "grafana | Ensure Docker is available"
  ansible.builtin.command: docker --version
  changed_when: false

- name: "grafana | Refuse the default or a weak administrator password"
  ansible.builtin.assert:
    that:
      - grafana_admin_password | length >= 16
      - grafana_admin_password != 'admin'
    fail_msg: >-
      grafana_admin_password must be supplied through a secret mechanism and
      contain at least 16 characters.
  no_log: true

- name: "grafana | Ensure the monitoring Docker network exists"
  ansible.builtin.command: docker network create {{ monitoring_docker_network }}
  register: grafana_network
  failed_when: >
    grafana_network.rc != 0 and
    'already exists' not in grafana_network.stderr
  changed_when: grafana_network.rc == 0

- name: "grafana | Create data + provisioning directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "472"
    group: "472"
    mode: '0755'
  loop:
    - "{{ grafana_data_dir }}"
    - "{{ grafana_provisioning_dir }}/datasources"
    - "{{ grafana_provisioning_dir }}/dashboards"
    - "{{ grafana_dashboards_dir }}"

- name: "grafana | Provision the Prometheus datasource"
  ansible.builtin.template:
    src: datasource-prometheus.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
    mode: '0644'

- name: "grafana | Provision the dashboards provider"
  ansible.builtin.copy:
    src: dashboards-provider.yml
    dest: "{{ grafana_provisioning_dir }}/dashboards/deployautomation.yml"
    mode: '0644'

- name: "grafana | Ship the default deployautomation dashboard"
  ansible.builtin.copy:
    src: deployautomation-overview.json
    dest: "{{ grafana_dashboards_dir }}/deployautomation-overview.json"
    mode: '0644'

- name: "grafana | Remove previous container if present"
  ansible.builtin.shell: docker rm -f grafana >/dev/null 2>&1 || true
  changed_when: false

- name: "grafana | Run Grafana container"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - grafana
      - --restart
      - unless-stopped
      - --read-only
      - --security-opt
      - no-new-privileges:true
      - --cap-drop
      - ALL
      - --pids-limit
      - "256"
      - --tmpfs
      - /tmp:rw,noexec,nosuid,size=64m
      - --network
      - "{{ monitoring_docker_network }}"
      - --publish
      - "{{ grafana_bind_address }}:{{ grafana_port }}:3000"
      - --volume
      - "{{ grafana_data_dir }}:/var/lib/grafana"
      - --volume
      - "{{ grafana_provisioning_dir }}:/etc/grafana/provisioning:ro"
      - --volume
      - "{{ grafana_dashboards_dir }}:/var/lib/grafana/dashboards"
      - --env
      - "GF_SECURITY_ADMIN_USER={{ grafana_admin_user }}"
      - --env
      - "GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}"
      - "{{ grafana_image }}"
  register: grafana_run
  changed_when: grafana_run.rc == 0
  no_log: true
