---
- name: "alertmanager | Ensure Docker is available"
  ansible.builtin.command: docker --version
  changed_when: false

- name: "alertmanager | Ensure the monitoring Docker network exists"
  ansible.builtin.command: docker network create {{ monitoring_docker_network }}
  register: alertmanager_network
  failed_when: >
    alertmanager_network.rc != 0 and
    'already exists' not in alertmanager_network.stderr
  changed_when: alertmanager_network.rc == 0

- name: "alertmanager | Create configuration directory"
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "alertmanager | Create storage directory"
  ansible.builtin.file:
    path: "{{ alertmanager_storage_dir }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: '0750'

- name: "alertmanager | Render configuration"
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: root
    mode: '0644'

- name: "alertmanager | Remove previous container if present"
  ansible.builtin.shell: docker rm -f alertmanager >/dev/null 2>&1 || true
  changed_when: false

- name: "alertmanager | Run Alertmanager container"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - alertmanager
      - --restart
      - unless-stopped
      - --read-only
      - --security-opt
      - no-new-privileges:true
      - --cap-drop
      - ALL
      - --pids-limit
      - "128"
      - --tmpfs
      - /tmp:rw,noexec,nosuid,size=32m
      - --network
      - "{{ monitoring_docker_network }}"
      - --publish
      - "{{ alertmanager_bind_address }}:{{ alertmanager_port }}:9093"
      - --volume
      - "{{ alertmanager_config_dir }}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - --volume
      - "{{ alertmanager_storage_dir }}:/alertmanager"
      - "{{ alertmanager_image }}"
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
  register: alertmanager_run
  changed_when: alertmanager_run.rc == 0
