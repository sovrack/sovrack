---
# PostgreSQL en conteneur Docker, piloté via community.docker.docker_container
# (module idempotent : ne recrée le conteneur que si sa config a changé).
# Nécessite le SDK Python Docker côté cible, délégué au rôle commun docker_sdk
# (mutualisé avec redis et traefik).
# Exécuté en become (root). Les données vivent dans un volume nommé → une
# éventuelle recréation ne les perd pas.

- name: "postgres | Vérifier que Docker est disponible"
  ansible.builtin.command: docker info
  register: _pg_docker
  changed_when: false
  failed_when: _pg_docker.rc != 0

- name: "postgres | Prérequis SDK Python Docker"
  ansible.builtin.include_role:
    name: docker_sdk

- name: "postgres | Exiger un mot de passe (PostgreSQL refuse de démarrer sans)"
  ansible.builtin.assert:
    that:
      - postgres_password | default('') | length > 0
    fail_msg: "postgres_password doit être défini (extra-vars) pour démarrer PostgreSQL."

- name: "postgres | Réseau Docker partagé '{{ postgres_network }}'"
  ansible.builtin.command: "docker network create {{ postgres_network }}"
  register: _pg_net
  changed_when: _pg_net.rc == 0
  failed_when: >-
    _pg_net.rc != 0 and 'already exists' not in (_pg_net.stderr | default(''))

- name: "postgres | Volume de données persistant '{{ postgres_volume }}'"
  ansible.builtin.command: "docker volume create {{ postgres_volume }}"
  changed_when: false # idempotent (docker renvoie le nom du volume, rc 0)

- name: "postgres | Conteneur PostgreSQL (idempotent)"
  community.docker.docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: "{{ postgres_network }}"
    published_ports:
      - "127.0.0.1:{{ postgres_port }}:5432"
    env:
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: "{{ postgres_db }}"
    volumes:
      - "{{ postgres_volume }}:/var/lib/postgresql/data"
  no_log: true # le mot de passe figure dans les variables d'environnement → ne jamais le logger
