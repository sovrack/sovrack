---
# PostgreSQL exécuté en CONTENEUR Docker (pré-requis : rôle docker installé).
# Les apps déployées le joignent par son nom de conteneur sur le réseau partagé.
postgres_image: postgres:16-alpine
postgres_container_name: postgres
postgres_network: web # même réseau que les apps → joignable via «postgres:5432»
postgres_port: 5432 # publié sur 127.0.0.1 uniquement (jamais exposé publiquement)
postgres_volume: postgres_data # volume nommé → persistance de /var/lib/postgresql/data
postgres_user: postgres
postgres_db: postgres
# IMPORTANT : surcharger via extra-vars avec un mot de passe fort en production.
postgres_password: "change-me-postgres"
