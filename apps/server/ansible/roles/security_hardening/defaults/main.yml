---
security_enable_unattended_upgrades: true
security_sshd_password_authentication: 'no'
# IMPORTANT : tout serveur préparé par la plateforme est un HÔTE DOCKER, qui a
# BESOIN du routage IP (ip_forward=1) pour acheminer le trafic des ports publiés
# vers les conteneurs. Le mettre à 0 (durcissement générique) casse le réseau
# des conteneurs au prochain reboot / reload sysctl → timeouts. On le force donc
# à 1, de façon persistante, pour qu'il survive aux redémarrages. Les deux autres
# valeurs (redirects) restent du durcissement sûr, sans impact sur Docker.
security_sysctl_values:
  net.ipv4.ip_forward: '1'
  net.ipv4.conf.all.accept_redirects: '0'
  net.ipv4.conf.all.send_redirects: '0'
