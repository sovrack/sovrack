[defaults]
inventory           = inventories/
roles_path          = ./roles/
collections_path    = ~/.ansible/collections
remote_user         = ubuntu
host_key_checking   = True
stdout_callback     = default
force_handlers      = True
# Cleaner deployment logs: hide noisy deprecation warnings. (We keep
# inject_facts_as_vars at its default so roles using ansible_os_family work.)
deprecation_warnings = False

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
