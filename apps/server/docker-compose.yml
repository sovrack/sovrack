# =============================================================================
# DOCKER COMPOSE - BACKEND DEVOPS PLATFORM
# =============================================================================
# Ce fichier lance toute la stack locale avec une seule commande.
#
# Commandes principales:
# - Lancer tout (API + DB): docker compose up -d --build
# - Arreter tout (sans supprimer): docker compose stop
# - Arreter et supprimer (conteneurs + reseau): docker compose down
# - Nettoyer aussi les donnees PostgreSQL: docker compose down -v
# - Voir l'etat: docker compose ps
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SERVICE DATABASE (PostgreSQL)
  # ---------------------------------------------------------------------------
  # Role:
  # - Fournit la base de donnees PostgreSQL pour Prisma/NestJS.
  # - Expose le port DB_PORT vers l'hote pour DBeaver ou autres clients.
  database:
    image: postgres:16-alpine
    container_name: nestjs_devops_db
    restart: unless-stopped

    # Variables d'initialisation de PostgreSQL (depuis .env).
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # Healthcheck: permet a Compose de savoir quand la DB est vraiment prete.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    # Port host:container => ex: 5432:5432
    ports:
      - "${DB_PORT}:5432"

    # Volume persistant pour conserver les donnees meme apres arret du conteneur.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # SERVICE BACKEND (NestJS)
  # ---------------------------------------------------------------------------
  # Role:
  # - Lance l'API NestJS en mode developpement.
  # - Attend que la DB soit healthy avant de demarrer.
  backend:
    image: node:22-alpine
    container_name: nestjs_devops_api
    restart: unless-stopped
    working_dir: /app

    # Ne demarre l'API qu'une fois la base operationnelle.
    depends_on:
      database:
        condition: service_healthy

    # Charge les variables du projet.
    env_file:
      - .env

    # Ecrase DATABASE_URL pour la communication interne Docker (service "database").
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}

    # Workflow de demarrage du conteneur API.
    command: sh -c "npm install && npm run prisma:generate && npm run start:dev"

    # Expose l'API (host:container), typiquement 3001:3001.
    ports:
      - "${PORT}:3001"

    # Monte le code source local dans le conteneur pour le dev en temps reel.
    # Le volume anonyme /app/node_modules evite les conflits de node_modules host/container.
    volumes:
      - ./:/app
      - /app/node_modules

# -----------------------------------------------------------------------------
# VOLUMES
# -----------------------------------------------------------------------------
# Volume nomme pour persister les donnees PostgreSQL.
volumes:
  postgres_data: