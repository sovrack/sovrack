# =============================================================================
# Stack BACKEND (dev / standalone) : PostgreSQL + Redis + backend NestJS.
# - DB seule (backend lancé via `npm run start:dev`) → docker-compose.db.yml
# - Stack complète conteneurisée → ce fichier : `docker compose up -d --build`
# Variables lues depuis backend/.env (DB_USER, DB_PASSWORD, DB_NAME, PORT…).
# =============================================================================
services:
  database:
    image: postgres:16-alpine
    container_name: platform_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-devops_platform}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devops_platform}']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - backend_pgdata:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: platform_backend_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - backend_redisdata:/data
    networks: [backend]

  backend:
    build:
      context: .
    container_name: platform_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-devops_platform}
      REDIS_URL: redis://redis:6379
      ANSIBLE_PLAYBOOKS_PATH: /app/ansible/playbooks
      NODE_ENV: production
    ports:
      - '${PORT:-3001}:3001'
    networks: [backend]

volumes:
  backend_pgdata:
  backend_redisdata:

networks:
  backend:
