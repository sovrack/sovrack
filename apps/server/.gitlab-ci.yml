stages:
  - test
  - build
  - notify

test:
  stage: test
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint --if-present
    - npm run test --if-present -- --passWithNoTests
  only:
    - develop
    - main

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull $IMAGE_LATEST || true
    - docker build --cache-from $IMAGE_LATEST --tag $IMAGE_TAG --tag $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  only:
    - develop
    - main

notify:
  stage: notify
  image: alpine:3.19
  script:
    - echo "Pipeline OK for $CI_COMMIT_SHA on $CI_COMMIT_REF_NAME"
    - echo "Image pushed:$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  when: on_success
  only:
    - develop
    - main