# =============================================================================
# Backend CI — lint · typecheck · test · build.
# This repo's root IS the backend (no monorepo cd). Test jobs spin up Postgres
# and Redis as GitLab services; e2e uses Testcontainers-free service DBs.
# =============================================================================
stages:
  - validate
  - test
  - build
  - security

default:
  image: node:20

variables:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deploy_automation_test
  REDIS_URL: redis://redis:6379
  CONFIG_SECRET: ci-config-secret-minimum-32-characters-ok
  JWT_SECRET: ci-jwt-secret-minimum-32-characters-ok
  ANSIBLE_PLAYBOOKS_PATH: /tmp/playbooks
  ANSIBLE_VENV_PATH: /tmp/venv
  NODE_ENV: test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck:
  stage: validate
  # On typechecke le CODE APPLICATIF via tsconfig.build.json (qui exclut les
  # *.spec.ts), pas le tsconfig racine : plusieurs specs préexistantes ne
  # passent pas `tsc --noEmit` strict (typage des mocks : `never`/`any` sur
  # boot-helpers.spec.ts, automation.gateway.spec.ts,
  # service-templates-factory.service.spec.ts…). Les TESTS eux-mêmes passent
  # (Jest via swc/ts-jest, transpile-only). Nettoyer le typage de ces specs
  # reste une dette séparée, hors de ce garde-fou (qui protège le code livré).
  script:
    - npm ci
    - npm run prisma:generate
    - npx tsc --noEmit -p tsconfig.build.json

lint:
  stage: validate
  # Bloquant : la dette de lint a été résorbée (0 erreur). On empêche désormais
  # toute régression de qualité d'entrer dans la base.
  script:
    - npm ci
    - npm run lint
    - npm run format:check

arch:check:
  stage: validate
  # Gate des frontières de modules (dependency-cruiser) — existait localement
  # depuis plusieurs sprints mais n'était jamais exécutée en CI, donc jamais
  # réellement bloquante pour une régression de dépendance circulaire/couche.
  script:
    - npm ci
    - npm run arch:check

test:unit:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: deploy_automation_test
  script:
    - npm ci
    - npx prisma migrate deploy
    # --coverage enforces the coverageThreshold gate (regression ratchet) in jest config.
    - npm test -- --passWithNoTests --forceExit --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

test:e2e:
  stage: test
  timeout: 15 minutes
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: deploy_automation_test
  script:
    - npm ci
    - npx prisma migrate deploy
    - npm run test:e2e

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 2 hours

# Construit et pousse l'image Docker de production vers le Container Registry
# GitLab intégré (méthode B, plan produit final). Kaniko plutôt que
# `docker build` : ce runner ("docker" executor, gitlab-docker-runner-2) n'a
# PAS Docker-in-Docker — mémé limite déjà rencontrée et contournée pour
# test:e2e (Testcontainers). Kaniko construit une image OCI sans daemon
# Docker, fonctionne sur n'importe quel runner sans privileged mode.
# CI_REGISTRY_USER/PASSWORD sont fournis automatiquement par GitLab pour
# CE projet — rien à créer côté utilisateur pour CETTE étape.
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory. Moderate
# advisories are reported but non-blocking (run `npm audit` to see them).
security:audit:
  stage: security
  script:
    - npm ci
    - npm audit --audit-level=high

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by
# test:unit (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  needs:
    - job: test:unit
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# Trivy filesystem scan (dependencies + IaC). Informational: CVE feeds change
# daily, so a daily-new CVE shouldn't break an unrelated MR. Review its report.
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true
