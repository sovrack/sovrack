# =============================================================================
# Backend CI — lint · typecheck · test · build.
# This repo's root IS the backend (no monorepo cd). Test jobs spin up Postgres
# and Redis as GitLab services; e2e uses Testcontainers-free service DBs.
# =============================================================================
stages:
  - validate
  - test
  - build
  - security

default:
  image: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  tags:
    - sovrack-ci

variables:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deploy_automation_test
  REDIS_URL: redis://redis:6379
  CONFIG_SECRET: ci-config-secret-minimum-32-characters-ok
  JWT_SECRET: ci-jwt-secret-minimum-32-characters-ok
  # Secret indépendant (jamais dérivé de JWT_SECRET) — exigé par env.validation.
  STAFF_JWT_SECRET: ci-staff-jwt-secret-minimum-32-characters-ok
  # Secret HMAC indépendant pour les codes à usage unique staff.
  STAFF_OTP_SECRET: ci-staff-otp-secret-minimum-32-characters-ok
  # Secret HMAC indépendant pour les codes de secours de la MFA client
  # facultative. L'export OpenAPI initialise AppModule et valide donc lui aussi
  # l'intégralité du contrat d'environnement.
  CUSTOMER_MFA_SECRET: ci-customer-mfa-secret-minimum-32-characters-ok
  ANSIBLE_PLAYBOOKS_PATH: /tmp/playbooks
  ANSIBLE_VENV_PATH: /tmp/venv
  NODE_ENV: test
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

typecheck:
  stage: validate
  # On typechecke le CODE APPLICATIF via tsconfig.build.json (qui exclut les
  # *.spec.ts), pas le tsconfig racine : plusieurs specs préexistantes ne
  # passent pas `tsc --noEmit` strict (typage des mocks : `never`/`any` sur
  # boot-helpers.spec.ts, automation.gateway.spec.ts,
  # service-templates-factory.service.spec.ts…). Les TESTS eux-mêmes passent
  # (Jest via swc/ts-jest, transpile-only). Nettoyer le typage de ces specs
  # reste une dette séparée, hors de ce garde-fou (qui protège le code livré).
  script:
    - npm ci
    - npm run prisma:generate
    - npx tsc --noEmit -p tsconfig.build.json

lint:
  stage: validate
  # La dette historique a été ramenée à zéro : tout nouvel avertissement est
  # désormais bloquant, au même titre qu'une erreur.
  script:
    - npm ci
    - npm run lint -- --max-warnings=0
    - npm run format:check

arch:check:
  stage: validate
  # Gate des frontières de modules (dependency-cruiser) — existait localement
  # depuis plusieurs sprints mais n'était jamais exécutée en CI, donc jamais
  # réellement bloquante pour une régression de dépendance circulaire/couche.
  script:
    - npm ci
    - npm run arch:check

test:unit:
  stage: test
  # GitLab déduit déjà les alias `postgres` et `redis` du nom des images.
  # Les répéter explicitement produit un avertissement avec Runner 19.x.
  services:
    - name: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    - name: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: deploy_automation_test
    # Active les assertions d'intégration qui inspectent le stockage brut des
    # secrets. Sans ce drapeau Jest les marque explicitement comme ignorées.
    RUN_DB_TESTS: "1"
  script:
    - npm ci
    - npx prisma migrate deploy
    # --coverage enforces the coverageThreshold gate (regression ratchet) in jest config.
    - npm test -- --passWithNoTests --runInBand --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

test:e2e:
  stage: test
  timeout: 15 minutes
  services:
    - name: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    - name: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deploy_automation_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: deploy_automation_test
  script:
    - npm ci
    - npx prisma migrate deploy
    - npm run test:e2e

# Full migration replay needs a Docker daemon but never the production host's
# socket. This tag must point to a disposable, isolated runner configured for
# Docker-in-Docker only.
test:migrations:
  stage: test
  image: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  tags:
    - sovrack-docker-tests
  services:
    # Seul le service DinD rootless reçoit le privilège du runner dédié ; le
    # conteneur du job Node reste non privilégié. L'alias `docker` est déduit
    # automatiquement du nom de l'image.
    - name: docker:27-dind-rootless@sha256:9d7346a1c76e658d818714d48d6154436bcf681ea3251985ccbe55f7788d9e20
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends docker.io
    - rm -rf /var/lib/apt/lists/*
  script:
    - npm ci
    - npm run test:migrations:phase2

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 2 hours

# BuildKit rootless builds and pushes without the host Docker socket and without
# a privileged application job.
build:image:
  stage: build
  tags:
    - sovrack-image-build
  image:
    name: moby/buildkit:v0.30.0-rootless@sha256:d76eb1caecac5733ef7553c1e90a1b21f1bb218cd1142d3553de0747b4a14ba9
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  needs:
    - job: contract:openapi
      artifacts: true
  script:
    - mkdir -p ~/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > ~/.docker/config.json
    - OPENAPI_SHA256="$(sha256sum artifacts/api-contract.openapi.json | awk '{print $1}')"
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt "build-arg:VCS_REF=$CI_COMMIT_SHA"
      --opt "build-arg:OPENAPI_SHA256=$OPENAPI_SHA256"
      --output "type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,push=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Publie le contrat produit par le backend. Le frontend peut le récupérer via
# un pipeline multi-projet sans dépendre d'un checkout frère implicite.
contract:openapi:
  stage: build
  script:
    - npm ci
    - npm run prisma:generate
    - OPENAPI_OUTPUT_PATH=artifacts/api-contract.openapi.json npm run openapi:export
  artifacts:
    paths:
      - artifacts/api-contract.openapi.json
    expire_in: 1 week

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory. Moderate
# advisories are reported but non-blocking (run `npm audit` to see them).
security:audit:
  stage: security
  script:
    - npm ci
    # Inclut les outils de build/test : ils manipulent eux aussi du code et des
    # artefacts dans le runner CI.
    - npm audit --audit-level=high

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by
# test:unit (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
    entrypoint: ['']
  needs:
    - job: test:unit
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# ─────────────────────────────────────────────────────────────────────────────
# DÉPLOIEMENT PRODUCTION — *géré par le dépôt `deploy-automation-infra`*
# -----------------------------------------------------------------------------
# Ce dépôt "app" ne fait QUE construire et pousser son image au Container
# Registry GitLab (job `build:image` ci-dessus → tag immuable
# `:$CI_COMMIT_SHA`).
#
# La mise à jour du service en production (docker compose pull && up -d) est
# orchestrée par le dépôt dédié `deploy-automation-infra` (stack `sovrack`),
# qui se synchronise et redéploie le VPS. → NE PAS réintroduire de SSH/deploy
# ici pour éviter le blocage "instance/app" qui n'existe pas.
# ─────────────────────────────────────────────────────────────────────────────

# Trivy filesystem scan (dependencies + IaC).
# Fail CI only on main branch — MRs show results without blocking.
security:trivy:
  stage: security
  image:
    name: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: false

# Scan the exact immutable runtime image as well as the source tree. This catches
# OS/global-tool vulnerabilities that npm audit and `trivy fs` cannot see.
security:image:
  stage: security
  image:
    name: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: ['']
  needs:
    - build:image
  variables:
    TRIVY_USERNAME: '$CI_REGISTRY_USER'
    TRIVY_PASSWORD: '$CI_REGISTRY_PASSWORD'
  script:
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - trivy image --format cyclonedx --output backend-sbom.cdx.json --no-progress "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - backend-sbom.cdx.json
    expire_in: 1 year
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
