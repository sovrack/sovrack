# =============================================================================
# Backend CI — lint · typecheck · test · build.
# This repo's root IS the backend (no monorepo cd). Test jobs spin up Postgres
# and Redis as GitLab services; e2e uses Testcontainers-free service DBs.
# =============================================================================
stages:
  - validate
  - test
  - build
  - security
  - deploy
  - verify

default:
  image: node:20

variables:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform_test
  REDIS_URL: redis://redis:6379
  CONFIG_SECRET: ci-config-secret-minimum-32-characters-ok
  JWT_SECRET: ci-jwt-secret-minimum-32-characters-ok
  ANSIBLE_PLAYBOOKS_PATH: /tmp/playbooks
  ANSIBLE_VENV_PATH: /tmp/venv
  NODE_ENV: test
  DEPLOY_PATH: /opt/deploy-automation/backend

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck:
  stage: validate
  script:
    - npm ci
    - npm run prisma:generate
    - npx tsc --noEmit

lint:
  stage: validate
  # Bloquant : la dette de lint a été résorbée (0 erreur). On empêche désormais
  # toute régression de qualité d'entrer dans la base.
  script:
    - npm ci
    - npm run lint
    - npm run format:check

test:unit:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: platform_test
  script:
    - npm ci
    - npx prisma migrate deploy
    # --coverage enforces the coverageThreshold gate (regression ratchet) in jest config.
    - npm test -- --passWithNoTests --forceExit --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

test:e2e:
  stage: test
  timeout: 15 minutes
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: platform_test
  script:
    - npm ci
    - npx prisma migrate deploy
    - npm run test:e2e

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 2 hours

# ── Security & quality gates ────────────────────────────────────────────────

# Dependency vulnerability gate: fail on any HIGH/CRITICAL advisory. Moderate
# advisories are reported but non-blocking (run `npm audit` to see them).
security:audit:
  stage: security
  script:
    - npm ci
    - npm audit --audit-level=high

# SonarQube static analysis + Quality Gate. Reuses the coverage produced by
# test:unit (coverage/lcov.info). Runs only when SONAR_TOKEN is configured.
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  needs:
    - job: test:unit
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_COMMIT_REF_SLUG}
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  rules:
    - if: '$SONAR_TOKEN'

# Trivy filesystem scan (dependencies + IaC). Informational: CVE feeds change
# daily, so a daily-new CVE shouldn't break an unrelated MR. Review its report.
security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  allow_failure: true

deploy:production:
  stage: deploy
  image: node:20
  resource_group: production
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends openssh-client rsync
    - mkdir -p ~/.ssh
    - printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_PATH"
    - test -n "$DEPLOY_SSH_PRIVATE_KEY"
    - rsync -az --delete
      --exclude '.git'
      --exclude 'node_modules'
      --exclude 'dist'
      --exclude 'coverage'
      --exclude '.env'
      --exclude '.env.*'
      --exclude '.ansible-venv'
      --exclude '.ansible-local'
      ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.yml up -d --build --remove-orphans"
  environment:
    name: production
    url: $DEPLOY_BASE_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST != "" && $DEPLOY_USER != "" && $DEPLOY_PATH != "" && $DEPLOY_SSH_PRIVATE_KEY != "" && $DEPLOY_BASE_URL != ""'
      when: manual
    - when: never

verify:production:
  stage: verify
  image: curlimages/curl:8.10.1
  needs:
    - job: deploy:production
  script:
    - test -n "$DEPLOY_BASE_URL"
    - curl -fsS "$DEPLOY_BASE_URL/health/ready"
  environment:
    name: production
    url: $DEPLOY_BASE_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_BASE_URL != ""'
      when: on_success
    - when: never
