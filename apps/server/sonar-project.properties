# SonarQube configuration — Deploy Automation Backend (NestJS).
# Run via the `sonarqube` CI job (needs SONAR_HOST_URL + SONAR_TOKEN).
sonar.projectKey=deploy-automation-backend
sonar.projectName=Deploy Automation Backend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Coverage (jest --coverage emits coverage/lcov.info).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude generated / vendored / non-product code from analysis + coverage.
sonar.exclusions=node_modules/**,dist/**,coverage/**,prisma/migrations/**,ansible/**,**/*.spec.ts,test/**
sonar.coverage.exclusions=**/*.spec.ts,test/**,**/*.module.ts,**/*.dto.ts,src/main.ts,prisma/**

# Block the pipeline on the project's Quality Gate result.
sonar.qualitygate.wait=true
