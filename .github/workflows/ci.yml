name: CI & Quality Gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks (Open-Source CLI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact --gitleaks-ignore-path .gitleaksignore

  validate:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Workspaces)
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=@sovrack/server run prisma:generate

      - name: Check Backend Lint & Architecture
        run: |
          npm --workspace=@sovrack/server run lint -- --max-warnings=0
          npm --workspace=@sovrack/server run arch:check

      - name: Check Frontend Lint & Types
        run: |
          npm --workspace=@sovrack/web run lint -- --max-warnings=0
          npm --workspace=@sovrack/web run type-check

      - name: Run Web Tests (Vitest)
        run: npm --workspace=@sovrack/web run test

      - name: Run Server Core Tests (Jest)
        run: npm --workspace=@sovrack/server run test -- --testPathPatterns="auth-cookie|image-resolver|service-templates|automation.gateway|deployments.gateway|server-setup.gateway|git-provider-config|traefik-route|database-s3-backup|enterprise-license"

      - name: Build Applications
        run: |
          npm --workspace=@sovrack/server run build
          npm --workspace=@sovrack/web run build

  infra-check:
    name: Infrastructure Lint & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          cd infra
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.monitoring.yml config -q

  build-and-push-images:
    name: Build & Package Docker Images (ghcr.io)
    needs: [security-scan, validate, infra-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Contract Hash
        id: contract
        run: |
          SHA="$(sha256sum apps/web/src/generated/api-contract.openapi.json | awk '{print $1}')"
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            OPENAPI_SHA256=${{ steps.contract.outputs.sha256 }}
          tags: |
            ghcr.io/sovrack/server:${{ github.sha }}
            ghcr.io/sovrack/server:latest

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.sovrack.com
            NEXT_PUBLIC_WS_URL=wss://app.sovrack.com
            NEXT_PUBLIC_PUBLIC_SITE_URL=https://sovrack.com
            NEXT_PUBLIC_CUSTOMER_APP_URL=https://app.sovrack.com
            NEXT_PUBLIC_APP_NAME=Sovrack
            NEXT_PUBLIC_APP_VERSION=3.1.0
            VCS_REF=${{ github.sha }}
            OPENAPI_SHA256=${{ steps.contract.outputs.sha256 }}
          tags: |
            ghcr.io/sovrack/web:${{ github.sha }}
            ghcr.io/sovrack/web:latest

      - name: Build Summary
        run: |
          echo "### 📦 Sovrack CI & Container Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Docker images successfully built and published to GHCR:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAPI Contract SHA**: \`${{ steps.contract.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Server Image**: \`ghcr.io/sovrack/server:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image**: \`ghcr.io/sovrack/web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production VPS (deploy.sh)
    needs: [build-and-push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sovrack.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Metadata & Invariants
        id: metadata
        run: |
          RELEASE_ID="v3.1.0-${GITHUB_SHA:0:10}"
          LATEST_MIGRATION="$(find apps/server/prisma/migrations -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tail -n 1)"
          OPENAPI_SHA256="$(sha256sum apps/web/src/generated/api-contract.openapi.json | awk '{print $1}')"
          
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "latest_migration=${LATEST_MIGRATION}" >> $GITHUB_OUTPUT
          echo "openapi_sha=${OPENAPI_SHA256}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH & deploy.sh
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          COMMIT_SHA: ${{ github.sha }}
          OPENAPI_SHA: ${{ steps.metadata.outputs.openapi_sha }}
          LATEST_MIGRATION: ${{ steps.metadata.outputs.latest_migration }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: RELEASE_ID,COMMIT_SHA,OPENAPI_SHA,LATEST_MIGRATION
          script: |
            set -euo pipefail
            umask 077
            echo "🚀 Promotion atomique de la release ${RELEASE_ID}..."

            SOVRACK_BASE_DIR="/srv/sovrack"
            REPO_DIR="/home/ubuntu/sovrack"
            RELEASE_DIR="${SOVRACK_BASE_DIR}/releases/${RELEASE_ID}"

            # 1. Synchronisation du dépôt Git hôte
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard "$COMMIT_SHA"
            fi

            # 2. Initialisation du layout versionné si nécessaire
            cd "$REPO_DIR/infra"
            SOVRACK_BASE_DIR="${SOVRACK_BASE_DIR}" ./scripts/bootstrap.sh

            # 3. Préparation du répertoire de release immuable
            mkdir -p "${RELEASE_DIR}"
            chmod 700 "${RELEASE_DIR}"
            cp -r "${REPO_DIR}/infra/"* "${RELEASE_DIR}/"
            echo "${COMMIT_SHA}" > "${RELEASE_DIR}/.infra-commit"

            # 4. Écriture du manifeste de release vérifié
            {
              echo "RELEASE_ID=${RELEASE_ID}"
              echo "BACKEND_IMAGE=ghcr.io/sovrack/server:${COMMIT_SHA}"
              echo "FRONTEND_IMAGE=ghcr.io/sovrack/web:${COMMIT_SHA}"
              echo "NGINX_IMAGE=nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"
              echo "POSTGRES_IMAGE=postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685"
              echo "REDIS_IMAGE=redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf"
              echo "BACKEND_COMMIT=${COMMIT_SHA}"
              echo "FRONTEND_COMMIT=${COMMIT_SHA}"
              echo "INFRA_COMMIT=${COMMIT_SHA}"
              echo "RUNTIME_TOPOLOGY=compact"
              echo "SCHEMA_MIGRATION=${LATEST_MIGRATION}"
              echo "OPENAPI_SHA256=${OPENAPI_SHA}"
            } > "${RELEASE_DIR}/release.manifest"
            chmod 600 "${RELEASE_DIR}/release.manifest"

            # 5. Exécution sécurisée de deploy.sh
            cd "${RELEASE_DIR}"
            export SOVRACK_BASE_DIR="${SOVRACK_BASE_DIR}"
            export SKIP_IMAGE_PROVENANCE_CHECK="false"
            "${RELEASE_DIR}/scripts/deploy.sh" --release-file "${RELEASE_DIR}/release.manifest"

            echo "✓ Release ${RELEASE_ID} promue avec succès sous ${SOVRACK_BASE_DIR}/current !"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Sovrack Production Deployment via \`deploy.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release ID**: \`${{ steps.metadata.outputs.release_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dernière Migration**: \`${{ steps.metadata.outputs.latest_migration }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Contrat OpenAPI SHA256**: \`${{ steps.metadata.outputs.openapi_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut**: Déployé avec succès et vérifié par sondes de santé." >> $GITHUB_STEP_SUMMARY
