name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks (Open-Source CLI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  validate:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Workspaces)
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=@sovrack/server run prisma:generate

      - name: Check Backend Lint & Architecture
        run: |
          npm --workspace=@sovrack/server run lint -- --max-warnings=0
          npm --workspace=@sovrack/server run arch:check

      - name: Check Frontend Lint & Types
        run: |
          npm --workspace=@sovrack/web run lint -- --max-warnings=0
          npm --workspace=@sovrack/web run type-check

      - name: Run Web Tests (Vitest)
        run: npm --workspace=@sovrack/web run test

      - name: Run Server Core Tests (Jest)
        run: npm --workspace=@sovrack/server run test -- --testPathPatterns="auth-cookie|image-resolver|service-templates|automation.gateway|deployments.gateway|server-setup.gateway|git-provider-config|traefik-route|database-s3-backup|enterprise-license"

      - name: Build Applications
        run: |
          npm --workspace=@sovrack/server run build
          npm --workspace=@sovrack/web run build

  infra-check:
    name: Infrastructure Lint & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Production Syntax
        run: |
          cd infra
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.dev.yml config -q

  build-and-push-images:
    name: Build & Package Docker Images (ghcr.io)
    needs: [security-scan, validate, infra-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sovrack/server:${{ github.sha }}
            ghcr.io/sovrack/server:latest

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.sovrack.com
            NEXT_PUBLIC_WS_URL=wss://app.sovrack.com
            NEXT_PUBLIC_PUBLIC_SITE_URL=https://sovrack.com
            NEXT_PUBLIC_CUSTOMER_APP_URL=https://app.sovrack.com
          tags: |
            ghcr.io/sovrack/web:${{ github.sha }}
            ghcr.io/sovrack/web:latest

  deploy-production:
    name: Deploy to Production VPS (158.69.214.62)
    needs: [build-and-push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sovrack.com
    steps:
      - name: Deploy to VPS via SSH
        if: env.HAS_SSH_KEY == 'true'
        env:
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || '158.69.214.62' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Updating Sovrack Production Stack..."
            cd /home/ubuntu/sovrack
            git fetch origin main
            git reset --hard origin/main
            cd infra
            docker compose -f docker-compose.prod.yml up -d
            echo "✓ Production containers reloaded."
            sleep 5
            curl -f -I http://127.0.0.1:80 || exit 1
            echo "✓ Production health checks passed."

      - name: Post Deployment Summary
        run: |
          echo "### 🚀 Sovrack Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Production platform deployed successfully to [https://sovrack.com](https://sovrack.com) and [https://app.sovrack.com](https://app.sovrack.com)." >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry Images**: \`ghcr.io/sovrack/server:latest\` & \`ghcr.io/sovrack/web:latest\`" >> $GITHUB_STEP_SUMMARY
