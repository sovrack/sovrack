name: CD — Staging Deployment (Manual or Automated)

on:
  workflow_run:
    workflows: ["Package — Container Registry (GHCR)"]
    branches: [main, dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branche ou commit SHA à déployer sur Staging'
        required: true
        default: 'main'
        type: string

concurrency:
  group: sovrack-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.sovrack.com
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.event.workflow_run.head_branch || 'main' }}
          fetch-depth: 1

      - name: Extract Staging Metadata
        id: metadata
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${COMMIT_SHA:0:10}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH & Staging Compose
        if: env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: COMMIT_SHA,GH_TOKEN,ACTOR
          script: |
            set -euo pipefail
            umask 077
            echo "🚀 Déploiement automatique de l'environnement STAGING (commit ${COMMIT_SHA})..."

            # 1. Authentification sécurisée et éphémère au registre GHCR
            if [ -n "${GH_TOKEN:-}" ]; then
              echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
            fi

            REPO_DIR="/home/ubuntu/sovrack"
            SECRETS_ENV="/srv/sovrack/.env.staging"
            if [ ! -f "$SECRETS_ENV" ]; then
              echo "Génération automatique de /srv/sovrack/.env.staging avec isolation stricte..."
              PROD_ENV="/srv/sovrack/.env.production"
              [ -f "$PROD_ENV" ] || PROD_ENV="/srv/sovrack/secrets.env"
              if [ -f "$PROD_ENV" ]; then
                cp "$PROD_ENV" "$SECRETS_ENV"
                sed -i 's/^DOMAIN=.*/DOMAIN=staging.sovrack.com/' "$SECRETS_ENV"
                sed -i 's/^APP_DOMAIN=.*/APP_DOMAIN=staging.sovrack.com/' "$SECRETS_ENV"
                sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=sovrack_staging/' "$SECRETS_ENV"
                sed -i 's/^REDIS_DB_INDEX=.*/REDIS_DB_INDEX=1/' "$SECRETS_ENV"
                NEW_JWT="$(openssl rand -hex 48)"
                NEW_OTP="$(openssl rand -hex 48)"
                sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${NEW_JWT}/" "$SECRETS_ENV"
                sed -i "s/^STAFF_JWT_SECRET=.*/STAFF_JWT_SECRET=${NEW_JWT}/" "$SECRETS_ENV"
                sed -i "s/^STAFF_OTP_SECRET=.*/STAFF_OTP_SECRET=${NEW_OTP}/" "$SECRETS_ENV"
                chmod 600 "$SECRETS_ENV"
                echo "✓ /srv/sovrack/.env.staging généré avec secrets étanches."
              fi
            fi

            # 2. Mise à jour des manifests infra depuis le commit promu
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin "${COMMIT_SHA}" 2>/dev/null || git fetch --all --tags
              git reset --hard "${COMMIT_SHA}"
            fi

            # 3. Pull des nouvelles images (tag immuable par commit SHA)
            echo "Pull des conteneurs Staging pour le commit ${COMMIT_SHA}..."
            docker pull "ghcr.io/sovrack/server:${COMMIT_SHA}" || docker pull "ghcr.io/sovrack/server:dev" || true
            docker pull "ghcr.io/sovrack/web:${COMMIT_SHA}" || docker pull "ghcr.io/sovrack/web:dev" || true

            # 4. Vérification et création de la base sovrack_staging si inexistante
            echo "Vérification de la base PostgreSQL sovrack_staging..."
            if docker ps --format '{{.Names}}' | grep -q "^sovrack-postgres$"; then
              POSTGRES_USER="$(docker exec sovrack-postgres printenv POSTGRES_USER || echo postgres)"
              docker exec sovrack-postgres psql -U "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname = 'sovrack_staging'" | grep -q 1 || \
                docker exec sovrack-postgres psql -U "$POSTGRES_USER" -c "CREATE DATABASE sovrack_staging;"
              echo "✓ Base sovrack_staging prête."
            fi

            # 5. Déploiement de la stack Staging isolée
            cd "$REPO_DIR/infra"
            SERVER_IMAGE="ghcr.io/sovrack/server:${COMMIT_SHA}" \
            WEB_IMAGE="ghcr.io/sovrack/web:${COMMIT_SHA}" \
            docker compose --env-file "$SECRETS_ENV" -f docker-compose.staging.yml up -d --remove-orphans

            # 6. Rechargement Nginx à chaud pour router staging.sovrack.com
            if docker ps --format '{{.Names}}' | grep -q "^sovrack-proxy$"; then
              docker exec sovrack-proxy nginx -s reload || true
            fi

            # 7. Nettoyage de l'authentification GHCR
            docker logout ghcr.io || true
            echo "✅ Environnement STAGING déployé et prêt sur https://staging.sovrack.com"

      - name: Staging Deployment Summary
        run: |
          echo "### 🧪 Sovrack Staging Deployment (Automated)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environnement**: \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Déployé**: \`${{ steps.metadata.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.sovrack.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut**: ✅ Déployé avec succès" >> $GITHUB_STEP_SUMMARY
