name: CD — Production Immutable Deployment (deploy.sh)

on:
  workflow_run:
    workflows: ["CI & Quality Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_topology:
        description: 'Topology Runtime (compact ou split)'
        required: true
        default: 'compact'
        type: choice
        options:
          - compact
          - split
      skip_provenance_check:
        description: 'Ignorer temporairement la vérification de provenance d’image'
        required: false
        default: false
        type: boolean

concurrency:
  group: sovrack-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-immutable-release:
    name: Promote Immutable Release via deploy.sh
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sovrack.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Metadata & Invariants
        id: metadata
        run: |
          COMMIT_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          RELEASE_ID="v3.1.0-${COMMIT_SHA:0:10}"
          
          # Résolution du dernier schéma de migration Prisma
          LATEST_MIGRATION="$(find apps/server/prisma/migrations -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tail -n 1)"
          
          # Empreinte SHA256 du contrat OpenAPI
          OPENAPI_SHA256="$(sha256sum apps/web/src/generated/api-contract.openapi.json | awk '{print $1}')"
          
          # Images d'infrastructure immuables épinglées
          NGINX_IMAGE="nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"
          POSTGRES_IMAGE="postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685"
          REDIS_IMAGE="redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf"
          
          TOPOLOGY="${{ inputs.runtime_topology || 'compact' }}"
          
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "latest_migration=${LATEST_MIGRATION}" >> $GITHUB_OUTPUT
          echo "openapi_sha=${OPENAPI_SHA256}" >> $GITHUB_OUTPUT
          echo "nginx_image=${NGINX_IMAGE}" >> $GITHUB_OUTPUT
          echo "postgres_image=${POSTGRES_IMAGE}" >> $GITHUB_OUTPUT
          echo "redis_image=${REDIS_IMAGE}" >> $GITHUB_OUTPUT
          echo "topology=${TOPOLOGY}" >> $GITHUB_OUTPUT

      - name: Generate and Validate Local Release Manifest
        id: manifest
        run: |
          cat << EOF > release.manifest
          RELEASE_ID=${{ steps.metadata.outputs.release_id }}
          BACKEND_IMAGE=ghcr.io/sovrack/server:${{ steps.metadata.outputs.commit_sha }}
          FRONTEND_IMAGE=ghcr.io/sovrack/web:${{ steps.metadata.outputs.commit_sha }}
          NGINX_IMAGE=${{ steps.metadata.outputs.nginx_image }}
          POSTGRES_IMAGE=${{ steps.metadata.outputs.postgres_image }}
          REDIS_IMAGE=${{ steps.metadata.outputs.redis_image }}
          BACKEND_COMMIT=${{ steps.metadata.outputs.commit_sha }}
          FRONTEND_COMMIT=${{ steps.metadata.outputs.commit_sha }}
          INFRA_COMMIT=${{ steps.metadata.outputs.commit_sha }}
          RUNTIME_TOPOLOGY=${{ steps.metadata.outputs.topology }}
          SCHEMA_MIGRATION=${{ steps.metadata.outputs.latest_migration }}
          OPENAPI_SHA256=${{ steps.metadata.outputs.openapi_sha }}
          EOF

          echo "Contenu du manifeste généré :"
          cat release.manifest

          # Validation stricte selon les règles de release-lib.sh
          bash -c 'source infra/scripts/release-lib.sh && validate_release_manifest release.manifest'
          echo "✓ Manifeste de release formellement validé."

      - name: Deploy to VPS via SSH & deploy.sh
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          TOPOLOGY: ${{ steps.metadata.outputs.topology }}
          SKIP_PROV: ${{ inputs.skip_provenance_check && 'true' || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: RELEASE_ID,COMMIT_SHA,TOPOLOGY,SKIP_PROV
          script: |
            set -euo pipefail
            umask 077
            echo "🚀 Promotion atomique de la release ${RELEASE_ID} sur le VPS..."

            SOVRACK_BASE_DIR="${SOVRACK_BASE_DIR:-/srv/sovrack}"
            REPO_DIR="${SOVRACK_REPO_DIR:-/home/ubuntu/sovrack}"
            RELEASE_DIR="${SOVRACK_BASE_DIR}/releases/${RELEASE_ID}"

            # Synchronisation du dépôt Git hôte sur le commit exact
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard "$COMMIT_SHA"
            fi

            # Création du répertoire de release immuable
            mkdir -p "${RELEASE_DIR}"
            chmod 750 "${RELEASE_DIR}"

            # Copie de l'infrastructure vers le dossier de release versionné
            cp -r "${REPO_DIR}/infra/"* "${RELEASE_DIR}/"
            echo "${COMMIT_SHA}" > "${RELEASE_DIR}/.infra-commit"

            # Écriture du manifeste de release vérifié
            cat << 'MANIFEST_EOF' > "${RELEASE_DIR}/release.manifest"
            RELEASE_ID=${RELEASE_ID}
            BACKEND_IMAGE=ghcr.io/sovrack/server:${COMMIT_SHA}
            FRONTEND_IMAGE=ghcr.io/sovrack/web:${COMMIT_SHA}
            NGINX_IMAGE=nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
            POSTGRES_IMAGE=postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
            REDIS_IMAGE=redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
            BACKEND_COMMIT=${COMMIT_SHA}
            FRONTEND_COMMIT=${COMMIT_SHA}
            INFRA_COMMIT=${COMMIT_SHA}
            RUNTIME_TOPOLOGY=${TOPOLOGY}
            SCHEMA_MIGRATION=$(find "${REPO_DIR}/apps/server/prisma/migrations" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tail -n 1)
            OPENAPI_SHA256=$(sha256sum "${REPO_DIR}/apps/web/src/generated/api-contract.openapi.json" | awk '{print $1}')
            MANIFEST_EOF
            chmod 600 "${RELEASE_DIR}/release.manifest"

            echo "📦 Exécution orchestrée de deploy.sh..."
            cd "${RELEASE_DIR}"
            export SOVRACK_BASE_DIR="${SOVRACK_BASE_DIR}"
            export SKIP_IMAGE_PROVENANCE_CHECK="${SKIP_PROV}"

            # Appel de l'orchestrateur de production
            "${RELEASE_DIR}/scripts/deploy.sh" --release-file "${RELEASE_DIR}/release.manifest"

            echo "✓ Release ${RELEASE_ID} promue avec succès sous ${SOVRACK_BASE_DIR}/current !"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Sovrack Production Deployment via \`deploy.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release ID**: \`${{ steps.metadata.outputs.release_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.metadata.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Topology**: \`${{ steps.metadata.outputs.topology }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dernière Migration**: \`${{ steps.metadata.outputs.latest_migration }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Contrat OpenAPI SHA256**: \`${{ steps.metadata.outputs.openapi_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut**: Déployé avec succès et vérifié par sondes de santé." >> $GITHUB_STEP_SUMMARY
