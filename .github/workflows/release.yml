name: Release & Tag Packaging

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-release:
    name: Package Release & Tag Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Name
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          OPENAPI_SHA="$(sha256sum apps/web/src/generated/api-contract.openapi.json | awk '{print $1}')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "openapi_sha=${OPENAPI_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Server Release Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            OPENAPI_SHA256=${{ steps.tag.outputs.openapi_sha }}
          tags: |
            ghcr.io/sovrack/server:${{ steps.tag.outputs.tag }}
            ghcr.io/sovrack/server:${{ steps.tag.outputs.version }}
            ghcr.io/sovrack/server:latest

      - name: Build and Push Web Release Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.sovrack.com
            NEXT_PUBLIC_WS_URL=wss://app.sovrack.com
            NEXT_PUBLIC_PUBLIC_SITE_URL=https://sovrack.com
            NEXT_PUBLIC_CUSTOMER_APP_URL=https://app.sovrack.com
            NEXT_PUBLIC_APP_NAME=Sovrack
            NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.version }}
            VCS_REF=${{ github.sha }}
            OPENAPI_SHA256=${{ steps.tag.outputs.openapi_sha }}
          tags: |
            ghcr.io/sovrack/web:${{ steps.tag.outputs.tag }}
            ghcr.io/sovrack/web:${{ steps.tag.outputs.version }}
            ghcr.io/sovrack/web:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sovrack ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
