name: sovrack-scripts-test

x-sleeper: &sleeper
  image: alpine:3.22
  command: ["sh", "-c", "sleep 3600"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backup_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: backup_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_test -d backup_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    <<: *sleeper

  migrator:
    image: alpine:3.22
    command: ["sh", "-c", "true"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: node:22-alpine
    environment:
      PROCESS_ROLE: ${SERVER_PROCESS_ROLE:-${BACKEND_PROCESS_ROLE:-api}}
    command:
      - node
      - -e
      - >-
        require('http').createServer((_req,res)=>{res.writeHead(200,{'content-type':'application/json'});res.end('{"status":"ready"}')}).listen(3001)
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *sleeper
    profiles:
      - split-runtime
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    command:
      - node
      - -e
      - >-
        require('http').createServer((_req,res)=>{res.writeHead(200);res.end('ok')}).listen(3000)

  nginx:
    image: nginx:1.27-alpine
    command: ["sh", "-c", "sleep 3600"]
