# =============================================================================
# Sovrack Infrastructure — CI/CD GitLab
# -----------------------------------------------------------------------------
# Ce repo pilote le DÉPLOIEMENT de production. Il n'effectue aucun build de
# code app : il attend que les images backend/frontend existent déjà dans le
# registry (poussées par leur propre CI build:image) puis les déploie sur le
# VPS via rsync + docker compose.
#
# Variables CI/CD requises (Settings → CI/CD → Variables) :
#   PRODUCTION_HOST   : IP/hostname du VPS
#   PRODUCTION_USER   : user SSH (recommandé : utilisateur dédié "deploy")
#   SSH_PRIVATE_KEY   : clé privée de déploiement (autorisée sur le VPS)
#   DEPLOY_PATH       : chemin cible sur le VPS (défaut : /srv/sovrack)
# Tant qu'elles ne sont pas définies, le job deploy est désactivé.
# =============================================================================

stages:
  - validate
  - deploy

variables:
  DEPLOY_PATH: ${DEPLOY_PATH:-/srv/sovrack}

# ── Validation ────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image: docker:27
  script:
    - docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
  only:
    - main
    - merge_requests

shellcheck:
  stage: validate
  image: koalaman/shellcheck-alpine:latest
  script:
    - shellcheck scripts/*.sh
  only:
    - main
    - merge_requests

# ── Déploiement ───────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3
  needs: []
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - 'if [ -z "$SSH_PRIVATE_KEY" ]; then echo "ERROR: SSH_PRIVATE_KEY manquante"; exit 1; fi'
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$PRODUCTION_HOST" > ~/.ssh/known_hosts 2>/dev/null
  script:
    # 1. Synchronise les fichiers d'orchestration (jamais les .env)
    - rsync -az --delete --exclude '.env' --exclude '.git' --exclude 'data/' --exclude 'backups/' ./ "${PRODUCTION_USER}@${PRODUCTION_HOST}:${DEPLOY_PATH}/"
    # 2. (Optionnel) si le .env n'existe pas encore sur le VPS, le créer depuis le template
    - ssh "${PRODUCTION_USER}@${PRODUCTION_HOST}" "test -f ${DEPLOY_PATH}/.env || cp ${DEPLOY_PATH}/.env.production.example ${DEPLOY_PATH}/.env; cd ${DEPLOY_PATH} && ./scripts/deploy.sh"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
  environment:
    name: production
    url: https://$PRODUCTION_HOST