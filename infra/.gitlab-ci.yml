# =============================================================================
# Sovrack Infrastructure — CI/CD GitLab
# -----------------------------------------------------------------------------
# Ce repo pilote le DÉPLOIEMENT de production. Il n'effectue aucun build de
# code app : il attend que les images backend/frontend existent déjà dans le
# registry (poussées par leur propre CI build:image) puis les déploie sur le
# VPS via rsync + docker compose.
#
# Variables CI/CD requises (Settings → CI/CD → Variables) :
#   PRODUCTION_HOST   : IP/hostname du VPS
#   PRODUCTION_USER   : user SSH (recommandé : utilisateur dédié "deploy")
#   SSH_PRIVATE_KEY_B64: clé privée encodée en base64
#   SSH_KNOWN_HOSTS   : ligne known_hosts vérifiée hors bande (pas ssh-keyscan)
#   DEPLOY_PATH       : chemin cible sur le VPS (défaut : /srv/sovrack)
#   BACKEND_IMAGE     : image backend avec SHA Git complet ou digest sha256
#   FRONTEND_IMAGE    : image frontend avec SHA Git complet ou digest sha256
# Le job de production reste manuel même lorsque toutes les variables existent.
# =============================================================================

stages:
  - validate
  - deploy

variables:
  # Une variable GitLab de projet/groupe peut remplacer cette valeur.
  DEPLOY_PATH: /srv/sovrack

# ── Validation ────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image: docker:27
  script:
    - docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
  only:
    - main
    - merge_requests

shellcheck:
  stage: validate
  image: koalaman/shellcheck-alpine:latest
  script:
    - shellcheck scripts/*.sh
  only:
    - main
    - merge_requests

# ── Déploiement ───────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3
  resource_group: sovrack-production
  interruptible: false
  needs:
    - validate
    - shellcheck
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - 'test -n "$PRODUCTION_HOST" && test -n "$PRODUCTION_USER" && test -n "$SSH_PRIVATE_KEY_B64" && test -n "$SSH_KNOWN_HOSTS" || { echo "ERROR: variables SSH de production incomplètes"; exit 1; }'
    - 'test -n "$BACKEND_IMAGE" && test -n "$FRONTEND_IMAGE" || { echo "ERROR: BACKEND_IMAGE et FRONTEND_IMAGE sont obligatoires"; exit 1; }'
    - 'printf "%s\n" "$BACKEND_IMAGE" | grep -Eq "(@sha256:[0-9a-fA-F]{64}|:[0-9a-f]{40})$" || { echo "ERROR: BACKEND_IMAGE non immuable"; exit 1; }'
    - 'printf "%s\n" "$FRONTEND_IMAGE" | grep -Eq "(@sha256:[0-9a-fA-F]{64}|:[0-9a-f]{40})$" || { echo "ERROR: FRONTEND_IMAGE non immuable"; exit 1; }'
    - 'case "$DEPLOY_PATH" in /*) ;; *) echo "ERROR: DEPLOY_PATH doit être absolu"; exit 1 ;; esac; case "$DEPLOY_PATH" in *[!A-Za-z0-9._/-]*) echo "ERROR: DEPLOY_PATH contient un caractère interdit"; exit 1 ;; esac'
    - printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    # Synchronise l'orchestration sans toucher aux secrets, données, backups ni
    # fichiers temporaires d'une autre promotion.
    - rsync -az --omit-dir-times --no-perms --delete --exclude '.env' --exclude '.env.release.*' --exclude '.env.rollback.*' --exclude '.release-request' --exclude '.git' --exclude 'data/' --exclude 'backups/' ./ "${PRODUCTION_USER}@${PRODUCTION_HOST}:${DEPLOY_PATH}/"
    # Le manifeste éphémère ne contient aucun secret. deploy.sh le parse sans
    # `source`, valide les références, puis persiste atomiquement la promotion
    # dans le .env du VPS seulement après les healthchecks.
    - printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > .release-request
    - chmod 600 .release-request
    - scp .release-request "${PRODUCTION_USER}@${PRODUCTION_HOST}:${DEPLOY_PATH}/.release-request"
    - ssh "${PRODUCTION_USER}@${PRODUCTION_HOST}" "test -f '${DEPLOY_PATH}/.env' || { echo 'Il manque ${DEPLOY_PATH}/.env — lance scripts/bootstrap.sh sur le VPS.'; exit 1; }; cd '${DEPLOY_PATH}'; ./scripts/deploy.sh --release-file .release-request; status=\$?; rm -f .release-request; exit \$status"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  allow_failure: false
  environment:
    name: production
    url: https://$PRODUCTION_HOST
    deployment_tier: production
