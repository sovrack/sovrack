stages:
  - validate
  - package
  - deploy

default:
  tags:
    - sovrack-ci

variables:
  DEPLOY_PATH: /srv/sovrack
  NGINX_IMAGE: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  POSTGRES_IMAGE: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  REDIS_IMAGE: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  DOCKER_CLI_VERSION: '27.5.1'
  DOCKER_CLI_SHA256_AMD64: 4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640
  DOCKER_CLI_SHA256_ARM64: e6b53725a73763ab3f988c73f8772eaed429754c1a579db5ff11f21990fd1817
  DOCKER_COMPOSE_PACKAGE_VERSION: '2.40.3-1~debian.12~bookworm'
  DOCKER_COMPOSE_SHA256_AMD64: 8e631e31b602ee93eed88d7df477781e43bb8d78a8ad3429531f594029034c2c
  DOCKER_COMPOSE_SHA256_ARM64: 6fc02051772acbb061b2e5dbcbe15963576edd23517c73cea395305873d69aa8

# Le runner Docker-tests conserve une allowlist minimale `node:*`. Le client
# Docker CLI et le plugin Compose sont téléchargés depuis leurs distributions
# officielles, à des versions immuables vérifiées avant leur première
# exécution. Le job n'installe aucun daemon ; seul le service DinD rootless
# reçoit le privilège du runner dédié.
.docker-test-job:
  image: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  tags:
    - sovrack-docker-tests
  services:
    - name: docker:27-dind-rootless@sha256:9d7346a1c76e658d818714d48d6154436bcf681ea3251985ccbe55f7788d9e20
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    # UID/GID de l'utilisateur du service officiel docker:dind-rootless. Les
    # seuls chemins ajustés sont des fixtures éphémères générées par les tests.
    DIND_SHARED_UID: '1000'
    DIND_SHARED_GID: '1000'
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      case "$(uname -m)" in
        x86_64) docker_arch=x86_64; docker_sha="$DOCKER_CLI_SHA256_AMD64" ;;
        aarch64|arm64) docker_arch=aarch64; docker_sha="$DOCKER_CLI_SHA256_ARM64" ;;
        *) echo "Architecture non prise en charge pour Docker CLI : $(uname -m)"; exit 1 ;;
      esac
      docker_archive="$(mktemp -p /tmp docker-cli.XXXXXX.tgz)"
      curl --fail --location --silent --show-error --retry 3 \
        "https://download.docker.com/linux/static/stable/$docker_arch/docker-$DOCKER_CLI_VERSION.tgz" \
        --output "$docker_archive"
      printf '%s  %s\n' "$docker_sha" "$docker_archive" | sha256sum --check --strict -
      tar -xzf "$docker_archive" -C /tmp docker/docker
      install -m 0755 /tmp/docker/docker /usr/local/bin/docker
      docker --version
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - |
      case "$(uname -m)" in
        x86_64) compose_arch=amd64; compose_sha="$DOCKER_COMPOSE_SHA256_AMD64" ;;
        aarch64|arm64) compose_arch=arm64; compose_sha="$DOCKER_COMPOSE_SHA256_ARM64" ;;
        *) echo "Architecture non prise en charge pour Docker Compose : $(uname -m)"; exit 1 ;;
      esac
      compose_package="$(mktemp -p /tmp docker-compose.XXXXXX.deb)"
      compose_extract="$(mktemp -d -p /tmp docker-compose.XXXXXX)"
      compose_path=/usr/local/lib/docker/cli-plugins/docker-compose
      curl --fail --location --silent --show-error --retry 3 \
        "https://download.docker.com/linux/debian/dists/bookworm/pool/stable/$compose_arch/docker-compose-plugin_${DOCKER_COMPOSE_PACKAGE_VERSION}_${compose_arch}.deb" \
        --output "$compose_package"
      printf '%s  %s\n' "$compose_sha" "$compose_package" | sha256sum --check --strict -
      dpkg-deb -x "$compose_package" "$compose_extract"
      install -m 0755 \
        "$compose_extract/usr/libexec/docker/cli-plugins/docker-compose" \
        "$compose_path"
      docker compose version
    # Le daemon DinD rootless ne voit en écriture que le volume exact du projet,
    # contrairement au /tmp du job et au parent de CI_PROJECT_DIR. La copie de
    # release exclut explicitement ce répertoire temporaire.
    - export TMPDIR="$CI_PROJECT_DIR/.docker-test-tmp-$CI_JOB_ID"
    - mkdir -p "$TMPDIR"
  after_script:
    - rmdir "$CI_PROJECT_DIR/.docker-test-tmp-$CI_JOB_ID" 2>/dev/null || true

validate:compose:
  stage: validate
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  script:
    - docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

validate:shell:
  stage: validate
  image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  before_script:
    - apk add --no-cache bash
  script:
    - shellcheck -x scripts/*.sh tests/*.sh
    - ./tests/ansible-layout-test.sh
    - ./tests/release-manifest-test.sh
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Exercices destructifs confinés dans un daemon Docker jetable : mode
# maintenance Nginx, promotion immuable et restauration d'une sauvegarde.
validate:docker-integration:
  extends: .docker-test-job
  stage: validate
  script:
    - ./tests/nginx-maintenance-test.sh
    - ./tests/release-deploy-integration.sh
    - ./tests/backup-restore-integration.sh
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Qualification du conteneur réellement candidat à la promotion. Les images
# doivent être immuables et sont fournies par le pipeline de release.
qualify:runtime-hardening:
  extends: .docker-test-job
  stage: validate
  script:
    - ./tests/production-hardening-test.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/ && $BACKEND_IMAGE && $FRONTEND_IMAGE'

# A release bundle contains no secret. It binds the three source commits, both
# immutable application images, the exact DB schema and the API contract hash.
package:release:
  stage: package
  image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  needs:
    - validate:compose
    - validate:shell
    - validate:docker-integration
    - qualify:runtime-hardening
  before_script:
    - apk add --no-cache bash coreutils tar
    - 'test -n "$BACKEND_IMAGE" && test -n "$FRONTEND_IMAGE" && test -n "$BACKEND_COMMIT" && test -n "$FRONTEND_COMMIT"'
    - 'test -n "$SCHEMA_MIGRATION" && test -n "$OPENAPI_SHA256"'
    - 'test -n "$NGINX_IMAGE" && test -n "$POSTGRES_IMAGE" && test -n "$REDIS_IMAGE"'
    - 'RUNTIME_TOPOLOGY="${RUNTIME_TOPOLOGY:-compact}"; export RUNTIME_TOPOLOGY'
    - 'test "$RUNTIME_TOPOLOGY" = "split" || test "$RUNTIME_TOPOLOGY" = "compact" || test "$RUNTIME_TOPOLOGY" = "legacy-single"'
    - 'printf "%s" "$BACKEND_COMMIT" | grep -Eq "^[0-9a-fA-F]{40}$"'
    - 'printf "%s" "$FRONTEND_COMMIT" | grep -Eq "^[0-9a-fA-F]{40}$"'
    - 'printf "%s" "$OPENAPI_SHA256" | grep -Eq "^[0-9a-fA-F]{64}$"'
    - 'printf "%s" "$SCHEMA_MIGRATION" | grep -Eq "^[0-9]{14}_[a-z0-9_]+$"'
    - 'printf "%s" "$BACKEND_IMAGE" | grep -Eq "(@sha256:[0-9a-fA-F]{64}|:[0-9a-fA-F]{40})$"'
    - 'printf "%s" "$FRONTEND_IMAGE" | grep -Eq "(@sha256:[0-9a-fA-F]{64}|:[0-9a-fA-F]{40})$"'
    - 'for image in "$NGINX_IMAGE" "$POSTGRES_IMAGE" "$REDIS_IMAGE"; do printf "%s" "$image" | grep -Eq "^.+@sha256:[0-9a-fA-F]{64}$" || exit 1; done'
  script:
    - printf '%s\n' "$CI_COMMIT_SHA" > .infra-commit
    - |
      printf 'RELEASE_ID=%s\nBACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nNGINX_IMAGE=%s\nPOSTGRES_IMAGE=%s\nREDIS_IMAGE=%s\nBACKEND_COMMIT=%s\nFRONTEND_COMMIT=%s\nINFRA_COMMIT=%s\nRUNTIME_TOPOLOGY=%s\nSCHEMA_MIGRATION=%s\nOPENAPI_SHA256=%s\n' \
        "$CI_COMMIT_TAG" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$NGINX_IMAGE" "$POSTGRES_IMAGE" "$REDIS_IMAGE" \
        "$BACKEND_COMMIT" "$FRONTEND_COMMIT" "$CI_COMMIT_SHA" \
        "$RUNTIME_TOPOLOGY" "$SCHEMA_MIGRATION" "$OPENAPI_SHA256" > release.manifest
    - bash -c 'source scripts/release-lib.sh; validate_release_manifest release.manifest'
    # Build outside CI_PROJECT_DIR so tar never observes its own output while
    # walking the source tree (which otherwise fails with "file changed").
    - bundle_tmp="$(mktemp -p /tmp sovrack-infra.XXXXXX.tar.gz)"
    - tar -czf "$bundle_tmp" --exclude='.git' --exclude='*.tar.gz' --exclude='*.sha256' .
    - mv "$bundle_tmp" "sovrack-infra-$CI_COMMIT_SHA.tar.gz"
    - sha256sum "sovrack-infra-$CI_COMMIT_SHA.tar.gz" > "sovrack-infra-$CI_COMMIT_SHA.tar.gz.sha256"
  artifacts:
    paths:
      - sovrack-infra-$CI_COMMIT_SHA.tar.gz
      - sovrack-infra-$CI_COMMIT_SHA.tar.gz.sha256
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'

.deploy_release:
  stage: deploy
  image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
  tags:
    - sovrack-deploy
  resource_group: $TARGET_ENVIRONMENT
  interruptible: false
  needs:
    - job: package:release
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client tar
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - 'test -n "$TARGET_HOST" && test -n "$TARGET_USER" && test -n "$TARGET_SSH_PRIVATE_KEY_B64" && test -n "$TARGET_SSH_KNOWN_HOSTS"'
    - 'test -n "$REGISTRY_DEPLOY_USER" && test -n "$REGISTRY_DEPLOY_TOKEN"'
    - 'case "$TARGET_PATH" in /*) ;; *) echo "ERROR: TARGET_PATH doit être absolu"; exit 1 ;; esac'
    - 'case "$TARGET_PATH" in *[!A-Za-z0-9._/-]*) echo "ERROR: TARGET_PATH invalide"; exit 1 ;; esac'
    - 'printf "%s" "$CI_COMMIT_TAG" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$"'
    - printf '%s' "$TARGET_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$TARGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - |
      printf '%s\n' \
        'Host *' \
        '  BatchMode yes' \
        '  ConnectTimeout 15' \
        '  ConnectionAttempts 2' \
        '  ServerAliveInterval 15' \
        '  ServerAliveCountMax 3' \
        '  StrictHostKeyChecking yes' > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - bundle="sovrack-infra-$CI_COMMIT_SHA.tar.gz"
    - 'tar -xOf "$bundle" ./release.manifest | grep -Eqx "RUNTIME_TOPOLOGY=(split|compact)" || { echo "ERROR: une baseline legacy ne peut pas être promue par ce job"; exit 1; }'
    # The read-only registry credential exists on the target only during the
    # promotion. It is never persisted in the release bundle or shared .env.
    - printf '%s' "$REGISTRY_DEPLOY_TOKEN" | ssh "$TARGET_USER@$TARGET_HOST" "docker login '$CI_REGISTRY' --username '$REGISTRY_DEPLOY_USER' --password-stdin >/dev/null"
    - ssh "$TARGET_USER@$TARGET_HOST" "mkdir -p '$TARGET_PATH/incoming' '$TARGET_PATH/releases' '$TARGET_PATH/shared'"
    - scp "$bundle" "$bundle.sha256" "$TARGET_USER@$TARGET_HOST:$TARGET_PATH/incoming/"
    - |
      ssh "$TARGET_USER@$TARGET_HOST" "set -eu
      cd '$TARGET_PATH/incoming'
      sha256sum -c '$bundle.sha256'
      if [ -e '$TARGET_PATH/releases/$CI_COMMIT_TAG' ]; then
        test -f '$TARGET_PATH/releases/$CI_COMMIT_TAG/.bundle.sha256'
        cmp '$bundle.sha256' '$TARGET_PATH/releases/$CI_COMMIT_TAG/.bundle.sha256'
      else
        mkdir '$TARGET_PATH/releases/$CI_COMMIT_TAG'
        tar -xzf '$bundle' -C '$TARGET_PATH/releases/$CI_COMMIT_TAG'
        install -m 600 '$bundle.sha256' '$TARGET_PATH/releases/$CI_COMMIT_TAG/.bundle.sha256'
      fi
      if [ ! -f '$TARGET_PATH/shared/.env' ]; then
        test -f '$TARGET_PATH/.env'
        install -m 600 '$TARGET_PATH/.env' '$TARGET_PATH/shared/.env'
      fi
      SOVRACK_BASE_DIR='$TARGET_PATH' '$TARGET_PATH/releases/$CI_COMMIT_TAG/scripts/bootstrap.sh'
      SOVRACK_BASE_DIR='$TARGET_PATH' '$TARGET_PATH/releases/$CI_COMMIT_TAG/scripts/deploy.sh' --release-file '$TARGET_PATH/releases/$CI_COMMIT_TAG/release.manifest'
      rm -f '$TARGET_PATH/incoming/$bundle' '$TARGET_PATH/incoming/$bundle.sha256'"
  after_script:
    - |
      if [ -s ~/.ssh/id_ed25519 ] && [ -n "${TARGET_HOST:-}" ] && [ -n "${TARGET_USER:-}" ]; then
        ssh "$TARGET_USER@$TARGET_HOST" "docker logout '$CI_REGISTRY' >/dev/null 2>&1 || true" || true
      fi
  allow_failure: false

deploy:production:
  extends: .deploy_release
  variables:
    TARGET_ENVIRONMENT: sovrack-production
    TARGET_HOST: $PRODUCTION_HOST
    TARGET_USER: $PRODUCTION_USER
    TARGET_PATH: $DEPLOY_PATH
    TARGET_SSH_PRIVATE_KEY_B64: $SSH_PRIVATE_KEY_B64
    TARGET_SSH_KNOWN_HOSTS: $SSH_KNOWN_HOSTS
  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
