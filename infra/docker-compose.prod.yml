# =============================================================================
# Sovrack — Stack de PRODUCTION (projet compose unique "sovrack")
# -----------------------------------------------------------------------------
# Ce fichier est le SEUL point d'orchestration de production. Il décrit
# uniquement le déploiement (image + réseau + volume), jamais le code.
#
# Règles de bonnes pratiques appliquées :
#   * Un seul projet, un seul stack. Pas de multi-instances.
#   * postgres / redis exposés UNIQUEMENT sur 127.0.0.1 (jamais publique).
#   * nginx = la seule porte publique (80/443) qui route puis frontend/backend.
#   * Données sur un volume nommé persistant (hors /tmp, pas perdu au reboot).
#   * Imagerie = registry GitLab (produite par la CI des repos app).
# =============================================================================

name: sovrack

x-sovrack-common: &common
  restart: unless-stopped
  networks:
    - sovrack-net

services:
  # ─────────────────────────── REVERSE-PROXY / TLS ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sovrack-proxy
    <<: *common
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    # Remplace SEULEMENT ${DOMAIN} dans le template (préserve les variables
    # nginx $host/$request_uri etc.), contrairement à l'envsubst par défaut qui
    # viderait toutes les variables nginx.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        envsubst '$${DOMAIN}' < /etc/nginx/proxy.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  # ──────────────────────────── FRONTEND (Next.js) ───────────────────────────
  frontend:
    <<: *common
    image: ${FRONTEND_IMAGE:-registry.gitlab.com/deploy-automation/deploy-automation-frontend:latest}
    container_name: sovrack-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # URL de non(false) réseau interne pour le rewrite /backend-api
      BACKEND_INTERNAL_URL: http://backend:3001
      # Vars publiques déjà "baked" au build de l'image ; fournies de nouveau
      # pour la clarté (l'image doit déjà exposer les bonnes valeurs).
      NEXT_PUBLIC_API_URL: ${FRONTEND_PUBLIC_URL:-https://sovrack.tn}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_PUBLIC_URL:-wss://sovrack.tn}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Sovrack}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-2.0.0}

  # ──────────────────────────── BACKEND (NestJS) ─────────────────────────────
  backend:
    <<: *common
    image: ${BACKEND_IMAGE:-registry.gitlab.com/deploy-automation/deploy-automation-backend:latest}
    container_name: sovrack-backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Base de données (redis/chemin via le réseau docker)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Redis (avec mot de passe)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Secrets JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET}
      STAFF_JWT_EXPIRES_IN: ${STAFF_JWT_EXPIRES_IN:-12h}
      # Chiffrement config
      CONFIG_SECRET: ${CONFIG_SECRET}
      # CORS : URL publique du frontend
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL:-https://sovrack.tn}
      FRONTEND_URLS: ${FRONTEND_PUBLIC_URL:-https://sovrack.tn}
      # Cookies sécurisés
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      STAFF_AUTH_COOKIE_SECURE: "true"
      # Ansible (joubbook embarqués)
      ANSIBLE_PLAYBOOKS_PATH: /app/ansible/playbooks
      ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections
      ANSIBLE_HOST_KEY_TRUST_ON_FIRST_USE: "false"
      ANSIBLE_STRICT_HOST_KEY_CHECKING: ${ANSIBLE_STRICT_HOST_KEY_CHECKING:-accept-new}
      STAFF_ROOT_EMAIL: ${STAFF_ROOT_EMAIL}
      STAFF_ROOT_PASSWORD: ${STAFF_ROOT_PASSWORD}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r&&r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
        reservations: { memory: 512M, cpus: "0.5" }

  # ──────────────────────────── POSTGRES (DB) ────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: sovrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Accessible uniquement depuis la machine hôte (opérations/backups).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
        reservations: { memory: 512M, cpus: "0.5" }

  # ────────────────────────────── REDIS ──────────────────────────────────────
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: sovrack-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --save 900 1
        --save 300 10
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.3" }
        reservations: { memory: 128M, cpus: "0.1" }

# ────────────────────────────── RÉSEAU ─────────────────────────────
networks:
  sovrack-net:
    driver: bridge

# ──────────────────────────── VOLUMES persistants ──────────────────────────
volumes:
  pgdata:
  redisdata:
  certbot-webroot:
  certbot-certs: