# =============================================================================
# Sovrack — Stack de PRODUCTION (projet compose unique "sovrack")
# -----------------------------------------------------------------------------
# Ce fichier est le SEUL point d'orchestration de production. Il décrit
# uniquement le déploiement (image + réseau + volume), jamais le code.
#
# Règles de bonnes pratiques appliquées :
#   * Un seul projet, un seul stack. Pas de multi-instances.
#   * postgres / redis exposés UNIQUEMENT sur 127.0.0.1 (jamais publique).
#   * nginx = la seule porte publique (80/443) qui route puis frontend/backend.
#   * Données sur un volume nommé persistant (hors /tmp, pas perdu au reboot).
#   * Imagerie = registry GitLab (produite par la CI des repos app).
# =============================================================================

name: sovrack

x-sovrack-common: &common
  restart: unless-stopped
  networks:
    - sovrack-net

services:
  # ─────────────────────────── REVERSE-PROXY / TLS ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sovrack-proxy
    <<: *common
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/acme-http.conf.template:/etc/nginx/acme-http.conf.template:ro
      - ./nginx/entrypoint.sh:/opt/sovrack/nginx-entrypoint.sh:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    # L'entrypoint démarre en HTTP/ACME si le certificat n'existe pas encore,
    # puis utilise automatiquement la configuration TLS aux démarrages suivants.
    entrypoint: ["/bin/sh", "/opt/sovrack/nginx-entrypoint.sh"]

  # ──────────────────────────── FRONTEND (Next.js) ───────────────────────────
  frontend:
    <<: *common
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable release tag or digest}
    container_name: sovrack-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      # Nom réseau interne pour le rewrite /backend-api
      BACKEND_INTERNAL_URL: http://backend:3001
      # Vars publiques déjà "baked" au build de l'image ; fournies de nouveau
      # pour la clarté (l'image doit déjà exposer les bonnes valeurs).
      NEXT_PUBLIC_API_URL: ${FRONTEND_PUBLIC_URL:-https://sovrack.tech}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_PUBLIC_URL:-wss://sovrack.tech}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Sovrack}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-2.0.0}

  # ──────────────────────────── BACKEND (NestJS) ─────────────────────────────
  backend:
    <<: *common
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    container_name: sovrack-backend
    environment: &backend-environment
      NODE_ENV: production
      PORT: "3001"
      PROCESS_ROLE: api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Base de données (redis/chemin via le réseau docker)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Redis (avec mot de passe)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Secrets JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET}
      STAFF_JWT_EXPIRES_IN: ${STAFF_JWT_EXPIRES_IN:-12h}
      # Chiffrement config
      CONFIG_SECRET: ${CONFIG_SECRET}
      # CORS : URL publique du frontend
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL:-https://sovrack.tech}
      FRONTEND_URLS: ${FRONTEND_PUBLIC_URL:-https://sovrack.tech}
      # Cookies sécurisés
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      STAFF_AUTH_COOKIE_SECURE: "true"
      # Ansible (joubbook embarqués)
      ANSIBLE_PLAYBOOKS_PATH: /app/ansible/playbooks
      ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections
      ANSIBLE_HOST_KEY_TRUST_ON_FIRST_USE: "false"
      ANSIBLE_STRICT_HOST_KEY_CHECKING: ${ANSIBLE_STRICT_HOST_KEY_CHECKING:-accept-new}
      STAFF_ROOT_EMAIL: ${STAFF_ROOT_EMAIL}
      STAFF_ROOT_PASSWORD: ${STAFF_ROOT_PASSWORD}
      # Google OAuth ("Se connecter avec Google")
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://${DOMAIN}/backend-api/auth/google/callback}
    expose:
      - "3001"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r&&r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
        reservations: { memory: 512M, cpus: "0.5" }

  # One-shot release gate. Ordinary API/worker restarts never run migrations.
  migrator:
    <<: *common
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    container_name: sovrack-migrator
    restart: "no"
    environment:
      <<: *backend-environment
      PROCESS_ROLE: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        node dist/scripts/backfill-database-credentials.js &&
        node dist/scripts/pre-migrate-check.js &&
        ./node_modules/.bin/prisma migrate deploy &&
        node prisma/seed-staff.js

  # Dedicated consumers/crons. No public port; WebSocket events are relayed
  # to the API process through the Redis adapter.
  worker:
    <<: *common
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    container_name: sovrack-worker
    environment:
      <<: *backend-environment
      PORT: "3002"
      PROCESS_ROLE: worker
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2.0" }
        reservations: { memory: 512M, cpus: "0.5" }

  # ──────────────────────────── POSTGRES (DB) ────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: sovrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Accessible uniquement depuis la machine hôte (opérations/backups).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
        reservations: { memory: 512M, cpus: "0.5" }

  # ────────────────────────────── REDIS ──────────────────────────────────────
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: sovrack-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --save 900 1
        --save 300 10
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.3" }
        reservations: { memory: 128M, cpus: "0.1" }

# ────────────────────────────── RÉSEAU ─────────────────────────────
networks:
  sovrack-net:
    driver: bridge

# ──────────────────────────── VOLUMES persistants ──────────────────────────
volumes:
  pgdata:
  redisdata:
  certbot-webroot:
    name: sovrack-certbot-webroot
  certbot-certs:
    name: sovrack-certbot-certs
