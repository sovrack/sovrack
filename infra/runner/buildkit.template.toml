[[runners]]
  limit = 1
  request_concurrency = 2
  output_limit = 16384
  [runners.docker]
    image = "moby/buildkit:v0.30.0-rootless"
    privileged = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 268435456
    security_opt = ["seccomp=unconfined", "apparmor=unconfined"]
    allowed_pull_policies = ["always", "if-not-present"]
    allowed_images = ["moby/buildkit:*-rootless", "moby/buildkit:*-rootless@sha256:*"]
    allowed_services = []
