[[runners]]
  limit = 1
  request_concurrency = 2
  output_limit = 16384
  [runners.docker]
    image = "node:22"
    privileged = false
    services_privileged = true
    allowed_privileged_services = [
      "docker:*-dind-rootless",
      "docker:*-dind-rootless@sha256:*",
      "docker.io/library/docker:*-dind-rootless",
      "docker.io/library/docker:*-dind-rootless@sha256:*"
    ]
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 268435456
    allowed_pull_policies = ["always", "if-not-present"]
    allowed_images = ["node:*", "node:*@sha256:*"]
    allowed_services = [
      "docker:*-dind-rootless",
      "docker:*-dind-rootless@sha256:*",
      "docker.io/library/docker:*-dind-rootless",
      "docker.io/library/docker:*-dind-rootless@sha256:*"
    ]
