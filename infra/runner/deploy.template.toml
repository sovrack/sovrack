[[runners]]
  limit = 1
  request_concurrency = 2
  output_limit = 8192
  [runners.docker]
    image = "alpine:3.22"
    privileged = false
    disable_cache = true
    volumes = ["/cache"]
    shm_size = 67108864
    allowed_pull_policies = ["always", "if-not-present"]
    allowed_images = ["alpine:*", "alpine:*@sha256:*"]
    allowed_services = []
