[[runners]]
  # Two lightweight validation jobs may run concurrently on the 8-GiB VM.
  limit = 2
  request_concurrency = 2
  output_limit = 16384
  [runners.docker]
    image = "alpine:3.22"
    privileged = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 268435456
    allowed_pull_policies = ["always", "if-not-present"]
    allowed_images = [
      "node:*",
      "docker:*",
      "alpine:*",
      "koalaman/shellcheck-alpine:*",
      "sonarsource/sonar-scanner-cli:*",
      "aquasec/trivy:*",
      "aquasec/trivy@sha256:*"
    ]
    allowed_services = ["postgres:*", "redis:*"]
