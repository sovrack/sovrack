# =============================================================================
# Sovrack — Stack de QUALIFICATION / STAGING (projet compose "sovrack-staging")
# -----------------------------------------------------------------------------
# Ce fichier orchestre l'environnement de Staging 100% hermétique et isolé :
#   * Base de données PostgreSQL dédiée : sovrack_staging
#   * Cache & queues Redis dédiées : index 1 (redis://redis:6379/1)
#   * Réseau Docker partagé : sovrack-network (pour joindre postgres & redis)
#   * Nginx route staging.sovrack.com exclusivement vers ces conteneurs staging
# =============================================================================

name: sovrack-staging

x-staging-common: &staging-common
  restart: unless-stopped
  init: true
  networks:
    sovrack-net:
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: 3

services:
  # ────────────────────────── STAGING WEB (Next.js) ──────────────────────────
  staging-web:
    <<: *staging-common
    image: ${WEB_IMAGE:-ghcr.io/sovrack/web:dev}
    build:
      context: ../apps/web
    container_name: sovrack-staging-web
    ports:
      - "${STAGING_WEB_PORT:-3000}:3000"
    networks:
      sovrack-net:
        aliases:
          - staging-frontend
          - staging-web
    depends_on:
      staging-server:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=100,gid=101,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=100,gid=101,mode=0750
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      SERVER_INTERNAL_URL: http://staging-server:3001
      BACKEND_INTERNAL_URL: http://staging-server:3001
      NEXT_PUBLIC_APP_NAME: "Sovrack (Staging)"
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-3.1.0-dev}
      NEXT_PUBLIC_API_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
      NEXT_PUBLIC_WS_URL: wss://${STAGING_DOMAIN:-staging.sovrack.com}
      PUBLIC_SITE_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
      CUSTOMER_APP_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    stop_grace_period: 20s

  # ───────────────────────── STAGING SERVER (NestJS) ─────────────────────────
  staging-server:
    <<: *staging-common
    image: ${SERVER_IMAGE:-ghcr.io/sovrack/server:dev}
    build:
      context: ../apps/server
    container_name: sovrack-staging-server
    ports:
      - "${STAGING_SERVER_PORT:-3001}:3001"
    networks:
      sovrack-net:
        aliases:
          - staging-backend
          - staging-server
    environment:
      NODE_ENV: production
      PORT: "3001"
      PROCESS_ROLE: api
      LOG_LEVEL: debug
      TRUST_PROXY: "1"
      # Base PostgreSQL hermétique pour Staging
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_STAGING_DB:-sovrack_staging}?schema=public
      # File Redis isolée sur l'index 1
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Secrets JWT dédiés à Staging
      JWT_SECRET: ${STAGING_JWT_SECRET:-${JWT_SECRET}}
      JWT_EXPIRES_IN: 24h
      STAFF_JWT_SECRET: ${STAGING_STAFF_JWT_SECRET:-${STAFF_JWT_SECRET}}
      STAFF_JWT_EXPIRES_IN: 12h
      STAFF_OTP_SECRET: ${STAGING_STAFF_OTP_SECRET:-${STAFF_OTP_SECRET}}
      CUSTOMER_MFA_SECRET: ${STAGING_CUSTOMER_MFA_SECRET:-${CUSTOMER_MFA_SECRET}}
      CONFIG_SECRET: ${STAGING_CONFIG_SECRET:-${CONFIG_SECRET}}
      FRONTEND_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
      FRONTEND_URLS: https://${STAGING_DOMAIN:-staging.sovrack.com}
      PUBLIC_SITE_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
      CUSTOMER_APP_URL: https://${STAGING_DOMAIN:-staging.sovrack.com}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: lax
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    stop_grace_period: 20s

  # ──────────────────────── STAGING PRISMA MIGRATOR ──────────────────────────
  staging-migrator:
    image: ${SERVER_IMAGE:-ghcr.io/sovrack/server:dev}
    container_name: sovrack-staging-migrator
    restart: "no"
    networks:
      - sovrack-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_STAGING_DB:-sovrack_staging}?schema=public
    entrypoint: ["npx", "prisma", "migrate", "deploy"]

networks:
  sovrack-net:
    name: sovrack-network
    external: true
