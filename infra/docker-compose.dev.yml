# Validation DEV autonome (build local, ports sans conflit) - NE PAS utiliser en prod
name: sovrack-dev
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sovrack-dev-proxy
    depends_on: [frontend, backend]
    environment: { DOMAIN: localhost }
    ports: ["127.0.0.1:13080:80"]
    volumes:
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    entrypoint: ["/bin/sh","-c"]
    command:
      - envsubst '$${DOMAIN}' < /etc/nginx/proxy.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
  frontend:
    image: sovrack-frontend:dev
    container_name: sovrack-dev-frontend
    depends_on: [backend]
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://localhost:13080/backend-api
      NEXT_PUBLIC_WS_URL: ws://localhost:13080/backend-api
      NEXT_PUBLIC_APP_NAME: "Sovrack (DEV)"
    ports: ["127.0.0.1:13012:3000"]
  backend:
    image: sovrack-backend:dev
    container_name: sovrack-dev-backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://dev:dev@postgres:5432/deploy_automation
      REDIS_URL: redis://:redis_dev@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET}
      STAFF_JWT_EXPIRES_IN: 12h
      CONFIG_SECRET: ${CONFIG_SECRET}
      FRONTEND_URL: http://localhost:13080
      FRONTEND_URLS: http://localhost:13080
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      STAFF_AUTH_COOKIE_SECURE: "false"
      ANSIBLE_PLAYBOOKS_PATH: /app/ansible/playbooks
      ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections
      ANSIBLE_STRICT_HOST_KEY_CHECKING: accept-new
      STAFF_ROOT_EMAIL: admin@sovrack.tech
      STAFF_ROOT_PASSWORD: Dev_Test_Only_1192
    expose: ["3001"]
    ports: ["127.0.0.1:13013:3001"]
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD-SHELL","node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r&&r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      retries: 10
      start_period: 40s
  postgres:
    image: postgres:16-alpine
    container_name: sovrack-dev-postgres
    environment: { POSTGRES_USER: dev, POSTGRES_PASSWORD: dev, POSTGRES_DB: deploy_automation }
    ports: ["127.0.0.1:15432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U dev"], interval: 10s, retries: 5 }
  redis:
    image: redis:7-alpine
    container_name: sovrack-dev-redis
    command: ["redis-server","--requirepass","redis_dev","--appendonly","yes"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck: { test: ["CMD-SHELL","redis-cli -a redis_dev ping | grep PONG"], interval: 10s, retries: 5 }
networks:
  default:
    name: sovrack-dev-net
