groups:
  - name: sovrack-external
    rules:
      - alert: SovrackPublicEndpointDown
        expr: probe_success{job=~"sovrack_external_https|sovrack_http_redirect"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sovrack public endpoint is unavailable"
          description: "The external probe for {{ $labels.instance }} has failed for more than two minutes."

      - alert: SovrackExternalLatencyHigh
        expr: probe_duration_seconds{job="sovrack_external_https"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sovrack external latency is high"
          description: "{{ $labels.instance }} has taken more than two seconds for five minutes."

      - alert: SovrackTLSCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="sovrack_external_https"} - time()) < 21 * 24 * 60 * 60
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Sovrack TLS certificate expires in less than 21 days"
          description: "The certificate observed at {{ $labels.instance }} must be renewed."

      - alert: SovrackTLSCertificateExpiryWarning
        expr: (probe_ssl_earliest_cert_expiry{job="sovrack_external_https"} - time()) < 45 * 24 * 60 * 60 and (probe_ssl_earliest_cert_expiry{job="sovrack_external_https"} - time()) >= 21 * 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Sovrack TLS certificate expires in less than 45 days"
          description: "Plan certificate renewal for {{ $labels.instance }}."

  - name: monitoring-host
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"node_exporter|cadvisor|blackbox_exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A monitoring target is down"
          description: "Prometheus cannot scrape {{ $labels.job }} / {{ $labels.instance }}."

      - alert: MonitoringHostDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring and CI host disk space is low"
          description: "Less than 15% disk space remains on {{ $labels.instance }}."

      - alert: MonitoringHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring and CI host memory is low"
          description: "Less than 10% available memory remains on {{ $labels.instance }}."

      - alert: SovrackWatchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Monitoring pipeline watchdog"
          description: "This alert must always be firing; its absence means the monitoring path is broken."
