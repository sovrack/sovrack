route:
  receiver: gitlab-operations
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The watchdog proves that rule evaluation and Alertmanager are alive. It
    # must remain local to avoid creating a permanent incident downstream.
    - receiver: local-operations
      matchers:
        - alertname="SovrackWatchdog"

receivers:
  - name: local-operations
  - name: gitlab-operations
    webhook_configs:
      - send_resolved: true
        url_file: /etc/alertmanager/secrets/gitlab-alert-url
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/gitlab-alert-token
