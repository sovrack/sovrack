global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: blackbox_exporter
    static_configs:
      - targets:
          - blackbox_exporter:9115

  - job_name: sovrack_external_https
    metrics_path: /probe
    params:
      module:
        - https_2xx
    static_configs:
      - targets:
          - https://sovrack.com/
          - https://sovrack.com/backend-api/health
          - https://sovrack.com/backend-api/health/live
          - https://sovrack.com/backend-api/health/ready
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: sovrack_http_redirect
    metrics_path: /probe
    params:
      module:
        - http_redirect
    static_configs:
      - targets:
          - http://sovrack.com/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
