modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_ssl: false
      tls_config:
        insecure_skip_verify: false

  http_redirect:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes:
        - 301
        - 308
      preferred_ip_protocol: ip4
      follow_redirects: false
